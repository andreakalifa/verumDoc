  /api/pdnd/v1/versamento:
    post:
      tags:
      - PDND
      summary: E-service 1 PDND — Versamento PA
      description: 'Versamento per conto del cliente del fruitore PDND: stesso caso d''uso, stesse

        regole, stesse risposte del REST (202 nuovo, 200 ripetuto, errori del catalogo).


        R03 f1 (REV-05): il corpo si legge IN STREAMING (``leggi_json_con_file``): il

        base64 si valida e si decodifica a blocchi in un file temporaneo mentre arriva,

        senza copie dell''intero file in memoria; al più

        ``PDND_RICHIESTE_CONTEMPORANEE_MAX`` versamenti per replica (oltre: 503

        PDND-503-OCCUPATO, ritentabile, prima di leggere il corpo). R03 f3 (REV-N2):

        il file decodificato prenota il suo massimo nel budget unico del disco

        temporaneo (``DISCO_TEMPORANEO_BUDGET_MB``); budget esaurito: stesso 503.'
      operationId: versamento_pdnd_api_pdnd_v1_versamento_post
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Idempotency-Key
      responses:
        '200':
          description: Stessa richiesta ripetuta (stessa Idempotency-Key)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersamentoResponse'
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersamentoResponse'
        4XX:
          $ref: '#/components/responses/ErroreRichiesta'
        5XX:
          $ref: '#/components/responses/ErroreServizio'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              description: 'Versamento di un documento (principale) tramite PDND.


                R03 (VD-C-092): ``id_documento`` e ``numero`` sono OBBLIGATORI e vengono dal

                fruitore (prima erano generati dall''orario); ``formato`` è facoltativo (il

                formato si rileva dal contenuto).'
              properties:
                classe_documentale:
                  maxLength: 50
                  minLength: 1
                  title: Classe Documentale
                  type: string
                registro:
                  anyOf:
                  - maxLength: 100
                    type: string
                  - type: 'null'
                  description: Registro della chiave UD (es. PROTOCOLLO)
                  title: Registro
                anno:
                  pattern: ^\d{4}$
                  title: Anno
                  type: string
                numero:
                  description: 'Numero della chiave UD: con registro e anno identifica l''unità documentaria
                    (VD-C-095)'
                  maxLength: 100
                  minLength: 1
                  title: Numero
                  type: string
                id_documento:
                  description: Identificativo del documento nel sistema del fruitore
                  maxLength: 100
                  minLength: 1
                  title: Id Documento
                  type: string
                nome_file:
                  maxLength: 255
                  minLength: 1
                  title: Nome File
                  type: string
                formato:
                  anyOf:
                  - maxLength: 255
                    type: string
                  - type: 'null'
                  description: MIME dichiarato (facoltativo; si confronta con il formato rilevato dal
                    contenuto)
                  title: Formato
                hash_sha256:
                  pattern: ^[0-9a-fA-F]{64}$
                  title: Hash Sha256
                  type: string
                file_b64:
                  description: File in base64 standard (limite PDND_MAX_FILE_MB)
                  title: File B64
                  type: string
                metadati:
                  additionalProperties: true
                  description: Metadati del documento (Allegato 5 e della classe), come «parametri» del
                    REST
                  title: Metadati
                  type: object
              required:
              - classe_documentale
              - anno
              - numero
              - id_documento
              - nome_file
              - hash_sha256
              - file_b64
              title: VersamentoPdndRequest
              type: object
      security:
      - voucherPDND: []
      x-verumdoc-servizio: gateway
      x-verumdoc-ingress:
        servizio: gateway
        raggiungibile: true
