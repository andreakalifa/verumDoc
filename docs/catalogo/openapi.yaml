# FILE GENERATO da tools/docs/genera_openapi.py importando le app FastAPI dei
# servizi pubblici: non modificarlo a mano. Rigenerare con
#   python tools/docs/genera_openapi.py
openapi: 3.1.0
info:
  title: VerumDoc API
  version: 3.0.0
  description: "API pubbliche di VerumDoc, servizio di conservazione digitale (Linee guida AgID).\nDocumento\
    \ GENERATO da `tools/docs/genera_openapi.py` importando le app FastAPI dei\nservizi: non modificarlo\
    \ a mano.\n\n- **Percorsi**: quelli esposti dall'ingress (`api.verumdoc.it`). `x-verumdoc-servizio`\n\
    \  indica il servizio che realizza l'operazione, `x-verumdoc-ingress` quello a cui\n  l'ingress oggi\
    \ la instrada (vedi `docs/catalogo/endpoint.md`).\n- **Errori**: sempre `application/problem+json`\
    \ (RFC 9457) con `codice`, `esito`\n  (NON_VALIDO, RIFIUTATO, ERRORE) e `ritentabile`; elenco in `docs/catalogo/errori.md`.\n\
    - **Idempotenza**: le richieste che creano un pacchetto o una sessione accettano\n  `Idempotency-Key`\
    \ (8-200 caratteri `[A-Za-z0-9._:-]`): stessa chiave, stessa risposta.\n- **Webhook**: sezione `webhooks`;\
    \ firma `VerumDoc-Firma` verificabile come in\n  `docs/integrazione/webhook.md`.\n"
  license:
    name: Proprietaria
servers:
- url: https://api.verumdoc.it
  description: Ingress pubblico
