components:
  schemas:
    AIPSearchRequest:
      properties:
        query:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Query
          description: Ricerca full-text
        tenant_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Tenant Id
          description: 'Solo profili del conservatore (SUPER_ADMIN, RSC_CONSERVATORE): ente in cui cercare;
            per gli altri ignorato (ente dell''identità)'
        classe_documentale:
          anyOf:
          - type: string
          - type: 'null'
          title: Classe Documentale
        anno:
          anyOf:
          - type: string
          - type: 'null'
          title: Anno
        data_da:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Data Da
        data_a:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Data A
        skip:
          type: integer
          minimum: 0.0
          title: Skip
          description: 'Non più supportato (R03): solo 0; usare `cursore`'
          default: 0
          deprecated: true
        limit:
          type: integer
          maximum: 100.0
          minimum: 1.0
          title: Limit
          default: 20
        cursore:
          anyOf:
          - type: string
            maxLength: 500
          - type: 'null'
          title: Cursore
          description: Cursore restituito dalla pagina precedente
      type: object
      title: AIPSearchRequest
    AIPSearchResult:
      properties:
        total:
          type: integer
          title: Total
          description: Risultati contati, al massimo RICERCA_CONTEGGIO_MASSIMO
        total_esatto:
          type: boolean
          title: Total Esatto
          description: 'false: i risultati sono più di `total`'
          default: true
        items:
          items:
            additionalProperties: true
            type: object
          type: array
          title: Items
        cursore:
          anyOf:
          - type: string
          - type: 'null'
          title: Cursore
          description: Da passare per la pagina successiva
        altri:
          type: boolean
          title: Altri
          default: false
        campi_testo:
          items:
            type: string
          type: array
          title: Campi Testo
          description: Campi in cui cerca il testo
      type: object
      required:
      - total
      - items
      title: AIPSearchResult
    AccountCreate:
      properties:
        nome_utente:
          type: string
          pattern: ^[a-z0-9][a-z0-9._-]{2,63}$
          title: Nome Utente
          description: 'Nome di accesso SSH: 3-64 caratteri minuscoli, cifre, «.», «_», «-»; unico fra
            tutti gli enti'
        descrizione:
          type: string
          maxLength: 200
          title: Descrizione
          description: Sistema che userà l'account (es. protocollo)
          default: ''
        user_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: User Id
          description: Utente dell'ente per conto del quale il canale versa; se assente, chi crea l'account
            (stesse regole delle chiavi API)
      additionalProperties: false
      type: object
      required:
      - nome_utente
      title: AccountCreate
    AccountUpdate:
      properties:
        descrizione:
          anyOf:
          - type: string
            maxLength: 200
          - type: 'null'
          title: Descrizione
        user_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: User Id
          description: Nuovo utente responsabile
      additionalProperties: false
      type: object
      title: AccountUpdate
    AggiungiAIPRequest:
      properties:
        aip_id:
          type: string
          title: Aip Id
        ruolo:
          type: string
          maxLength: 50
          minLength: 1
          title: Ruolo
          description: Ruolo dell'AIP nel fascicolo
          default: DOCUMENTO
        note:
          anyOf:
          - type: string
            maxLength: 2000
          - type: 'null'
          title: Note
      additionalProperties: false
      type: object
      required:
      - aip_id
      title: AggiungiAIPRequest
    Allarme:
      properties:
        id:
          type: string
          title: Id
          description: «testimone-<n>» o «blocco-<n>»
        fonte:
          type: string
          enum:
          - testimone
          - registro
          title: Fonte
        causa:
          type: string
          title: Causa
        aperto_il:
          type: string
          title: Aperto Il
        ultimo_il:
          type: string
          title: Ultimo Il
        occorrenze:
          type: integer
          title: Occorrenze
          description: Rifiuti del testimone o occorrenze del blocco
        dettagli:
          additionalProperties: true
          type: object
          title: Dettagli
        aperto:
          type: boolean
          title: Aperto
        gestito_il:
          anyOf:
          - type: string
          - type: 'null'
          title: Gestito Il
        gestito_da:
          anyOf:
          - type: string
          - type: 'null'
          title: Gestito Da
        nota:
          anyOf:
          - type: string
          - type: 'null'
          title: Nota
