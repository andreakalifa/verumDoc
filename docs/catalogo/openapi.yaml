          type: string
          title: Sha256
        dimensione:
          type: integer
          title: Dimensione
        nome_file:
          type: string
          title: Nome File
        firma:
          additionalProperties: true
          type: object
          title: Firma
      type: object
      required:
      - id
      - tipo
      - sha256
      - dimensione
      - nome_file
      - firma
      title: AllegatoCaricato
    AmbitoBozza:
