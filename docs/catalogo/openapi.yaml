          type: string
          title: Foglia Registro Dati
          description: Foglia del PdA nel registro
        prova_registro:
          $ref: '#/components/schemas/ProvaRegistro'
        checkpoint:
          type: string
          title: Checkpoint
          description: Checkpoint (nota firmata C2SP) di riferimento
        ciclo_vita:
          items:
            $ref: '#/components/schemas/FogliaCicloVita'
          type: array
          title: Ciclo Vita
          description: 'R05: foglie del ciclo di vita del PdA (scarto, annullamento, rettifica) coperte
            dallo stesso checkpoint, con la loro prova: uno scarto o un annullamento rende il contenuto
            NON più conservato. Scarto e annullamento ci sono SEMPRE tutti; le rettifiche al più CATENA_CICLO_VITA_MAX_FOGLIE
            (le più recenti)'
        ciclo_vita_totale:
          type: integer
          title: Ciclo Vita Totale
          description: 'Revisione R05 (R4): numero TOTALE delle foglie del ciclo di vita del PdA coperte
            dal checkpoint'
          default: 0
        ciclo_vita_completo:
          type: boolean
          title: Ciclo Vita Completo
          description: 'Revisione R05 (R4): false se «ciclo_vita» non le contiene tutte (rettifiche oltre
            il limite): lo stato del documento non è allora determinabile dalla sola prova e il verificatore
            non conclude «conservato»'
          default: true
        attestazione_ciclo_vita:
          anyOf:
          - type: string
          - type: 'null'
          title: Attestazione Ciclo Vita
          description: 'Revisione 2 di R05 (S8): nota firmata (C2SP, chiave del registro) che impegna,
            per questo PdA e questo checkpoint, il numero delle foglie del ciclo di vita e l''impronta
            del loro elenco (libs/catena/attestazione.py): una foglia di scarto tolta dalla prova non
            torna più. Senza, l''assenza di scarti non è dimostrabile. Revisione 3 di R05: v2, rilasciata
            SOLO per l''ultimo checkpoint, con l''istante del rilascio e lo stato del PdA firmati'
        attestazione_assente:
          anyOf:
          - type: string
          - type: 'null'
          title: Attestazione Assente
          description: 'Revisione 3 di R05 (T2): perché l''attestazione manca (checkpoint non più l''ultimo,
            chiave del registro non configurata)'
        ultimo_checkpoint:
          anyOf:
          - type: integer
          - type: 'null'
          title: Ultimo Checkpoint
          description: 'Revisione 3 di R05 (T2): dimensione dell''ultimo checkpoint del registro al momento
            della risposta'
        stato_pda:
          type: string
          enum:
          - CONSERVATO
          - SCARTO
          - SCARTO_PARZIALE
          title: Stato Pda
          description: 'Revisione 3 di R05 (T3): stato del PdA (SCARTO: scarto avviato o eseguito; SCARTO_PARZIALE:
            cancellazione iniziata e non completata). Firmato nell''attestazione'
          default: CONSERVATO
        attestazione_sigillo:
          anyOf:
          - type: string
          - type: 'null'
          title: Attestazione Sigillo
          description: 'R13a (VD-C-124): sigillo qualificato del conservatore sul testo dell''attestazione
            (CAdES staccata con marca, base64), secondo ATTESTAZIONE_SIGILLO (SEMPRE, SU_RICHIESTA con
            sigillo=true, DISATTIVO): protegge anche da chi controlla la chiave del registro'
        attestazione_sigillo_stato:
          type: string
          enum:
          - FIRMATO
          - NON_FIRMATO
          - NON_DISPONIBILE
          - NON_RICHIESTO
          - DISATTIVO
          title: Attestazione Sigillo Stato
          description: 'R13a: esito del sigillo sull''attestazione'
          default: DISATTIVO
        attestazione_sigillo_motivo:
          anyOf:
          - type: string
          - type: 'null'
          title: Attestazione Sigillo Motivo
      type: object
      required:
      - pda
      - documento
      - foglia_dati
      - prova_pda
      - radice_pda
      - foglia_registro_dati
      - prova_registro
      - checkpoint
      title: RispostaInclusione
