          maximum: 200
          minimum: 1
          default: 50
          title: Limit
      - name: skip
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 0
          - type: 'null'
          description: 'Non più supportato (R04): usare `cursore`'
          deprecated: true
          title: Skip
        description: 'Non più supportato (R04): usare `cursore`'
