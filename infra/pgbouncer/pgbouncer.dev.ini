; PgBouncer di SVILUPPO (docker compose --profile pool): stessa modalità e stessi
; parametri dell'esercizio (infra/helm/values.yaml, sezione pgbouncer), senza TLS
; verso il PostgreSQL locale. Credenziali di sviluppo in userlist.dev.txt.
[databases]
verumdoc_dev = host=postgres port=5432 dbname=verumdoc_dev
verumdoc_testimone = host=postgres port=5432 dbname=verumdoc_testimone

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
pool_mode = transaction
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/segreti/userlist.txt
max_client_conn = 1000
default_pool_size = 20
reserve_pool_size = 5
max_db_connections = 25
max_prepared_statements = 200
track_extra_parameters = IntervalStyle, default_transaction_read_only
server_tls_sslmode = disable
pidfile = /tmp/pgbouncer.pid
unix_socket_dir =
