# Stack osservabilità locale
# Avvio: docker compose -f docker-compose.yml -f infra/observability/docker-compose.observability.yml up -d

services:

  prometheus:
    image: prom/prometheus:v2.52.0
    container_name: vd-prometheus
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/observability/regole:/etc/prometheus/regole:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:10.4.0
    container_name: vd-grafana
    environment:
      # Password solo per lo stack locale: impostarla con GRAFANA_ADMIN_PASSWORD
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:?impostare GRAFANA_ADMIN_PASSWORD}"
      GF_PATHS_PROVISIONING: /etc/grafana/provisioning
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      # R14 (VD-C-033): cruscotti versionati
      - ./infra/observability/grafana/cruscotti:/var/lib/grafana/cruscotti:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
      - tempo

  loki:
    image: grafana/loki:2.9.0
    container_name: vd-loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  tempo:
    image: grafana/tempo:2.4.0
    container_name: vd-tempo
    command: [ "-config.file=/etc/tempo.yaml" ]
    volumes:
      - ./infra/observability/tempo.yaml:/etc/tempo.yaml:ro
    ports:
      - "3200:3200"   # Tempo UI
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP (R16: esportatore dei servizi)

volumes:
  grafana_data:
