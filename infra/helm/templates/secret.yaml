{{/*
Secret <servizio>-secrets: creati dal chart SOLO con secrets.create=true, con i
valori passati a riga di comando (--set-string secrets.values.<servizio>.<CHIAVE>=...).
Con create=false (predefinito) vanno creati fuori dal chart con le stesse chiavi
(SealedSecret o External Secrets): vedi infra/k8s/secrets/README.md.
*/}}
{{- if .Values.secrets.create }}
{{- $root := . }}
{{- range $name, $svc := .Values.services }}
{{- if and (include "verumdoc.attivo" (dict "root" $root "svc" $svc)) $svc.secretKeys }}
{{- $valori := default (dict) (index $root.Values.secrets.values $name) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-secrets
  namespace: {{ $root.Release.Namespace }}
  labels:
    app: {{ $name }}
    {{- include "verumdoc.labels" $root | nindent 4 }}
type: Opaque
stringData:
  {{- range $k := $svc.secretKeys }}
  {{ $k }}: {{ default "" (index $valori $k) | quote }}
  {{- end }}
{{- end }}
{{- /* Revisione 2 di R05 (S2): Secret proprio dei lavoratori con secretKeys
       (valori in secrets.values.<servizio>-<lavoratore>.<CHIAVE>) */}}
{{- if include "verumdoc.attivo" (dict "root" $root "svc" $svc) }}
{{- range $wn, $w := $svc.workers }}
{{- if and (ne (toString $w.enabled) "false") $w.secretKeys }}
{{- $nomeW := printf "%s-%s" $name $wn }}
{{- $valoriW := default (dict) (index $root.Values.secrets.values $nomeW) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $nomeW }}-secrets
  namespace: {{ $root.Release.Namespace }}
  labels:
    app: {{ $nomeW }}
    {{- include "verumdoc.labels" $root | nindent 4 }}
type: Opaque
stringData:
  {{- range $k := $w.secretKeys }}
  {{ $k }}: {{ default "" (index $valoriW $k) | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- /* Revisione R06 (V3): Secret proprio dei job periodici con secretKeys */}}
{{- range $jn, $j := $svc.cronJobs }}
{{- if and (ne (toString $j.enabled) "false") $j.secretKeys }}
{{- $nomeJ := printf "%s-%s" $name $jn }}
{{- $valoriJ := default (dict) (index $root.Values.secrets.values $nomeJ) }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $nomeJ }}-secrets
  namespace: {{ $root.Release.Namespace }}
  labels:
    app: {{ $nomeJ }}
    {{- include "verumdoc.labels" $root | nindent 4 }}
type: Opaque
stringData:
  {{- range $k := $j.secretKeys }}
  {{ $k }}: {{ default "" (index $valoriJ $k) | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
