{{/*
Job una tantum (services.<nome>.jobs, R04): es. le migrazioni Alembic PRIMA dei
servizi (REGOLE §27.2), come hook pre-install/pre-upgrade. Il Job parte prima
delle altre risorse del rilascio: non usa ConfigMap, Secret né ServiceAccount
del chart, solo le variabili «envSegreti» da Secret creati fuori dal chart.
*/}}
{{- $root := . }}
{{- range $name, $svc := .Values.services }}
{{- if include "verumdoc.attivo" (dict "root" $root "svc" $svc) }}
{{- range $jn, $j := $svc.jobs }}
{{- if ne (toString $j.enabled) "false" }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ $name }}-{{ $jn }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    app: {{ $name }}-{{ $jn }}
    app.kubernetes.io/component: {{ $jn }}
    {{- include "verumdoc.labels" $root | nindent 4 }}
  annotations:
    helm.sh/hook: {{ $j.helmHook | default "pre-install,pre-upgrade" }}
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  activeDeadlineSeconds: {{ $j.activeDeadlineSeconds | default 1800 }}
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: {{ $name }}-{{ $jn }}
        app.kubernetes.io/component: {{ $jn }}
        {{- include "verumdoc.labels" $root | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- include "verumdoc.pod" (dict "root" $root "nome" (printf "%s-%s" $name $jn) "servizio" $name "svc" $svc "w" $j "http" false "lavoratore" true "antiAffinita" false "job" true) | nindent 6 }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
