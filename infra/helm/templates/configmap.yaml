{{/*
ConfigMap <servizio>-config: solo variabili lette dalle Settings del servizio
(controllo: infra/k8s/verifica_manifest.py).
*/}}
{{- $root := . }}
{{- range $name, $svc := .Values.services }}
{{- if and (include "verumdoc.attivo" (dict "root" $root "svc" $svc)) $svc.config }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  namespace: {{ $root.Release.Namespace }}
  labels:
    app: {{ $name }}
    {{- include "verumdoc.labels" $root | nindent 4 }}
data:
  {{- range $k, $v := $svc.config }}
  {{ $k }}: {{ toString $v | quote }}
  {{- end }}
{{- end }}
{{- end }}
