{{/*
Volumi persistenti dei servizi (services.<nome>.persistentVolumes, R03 i2):
PVC <servizio>-<nome>, montato dal servizio e dai suoi lavoratori. Con più
repliche o lavoratori deve essere ReadWriteMany (verifica_manifest.py).
*/}}
{{- $root := . }}
{{- range $name, $svc := .Values.services }}
{{- if include "verumdoc.attivo" (dict "root" $root "svc" $svc) }}
{{- range $v := $svc.persistentVolumes }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}-{{ $v.name }}
  namespace: {{ $root.Release.Namespace }}
  labels:
    app: {{ $name }}
    {{- include "verumdoc.labels" $root | nindent 4 }}
  annotations:
    # I file dei clienti non si perdono con un «helm uninstall»
    helm.sh/resource-policy: keep
spec:
  accessModes: {{ toJson $v.accessModes }}
  storageClassName: {{ $v.storageClassName }}
  resources:
    requests:
      storage: {{ $v.size }}
{{- end }}
{{- end }}
{{- end }}
