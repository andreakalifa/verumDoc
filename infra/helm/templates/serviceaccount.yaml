{{/*
ServiceAccount: uno per servizio e uno per ogni lavoratore con blocco «iam»
proprio (R04: es. hashchain-verifica, sola lettura del WORM). Annotazione IRSA
con il ruolo creato da Terraform (modulo iam_servizi, VD-C-101):
<progetto>-<ambiente Terraform>-<nome>, es. verumdoc-prod-gateway (l'ambiente
Terraform è «prod», non «production», R03 i3). infra/k8s/verifica_manifest.py
controlla che ogni annotazione abbia il suo blocco «iam» e quindi il suo ruolo.
*/}}
{{- $root := . }}
{{- range $name, $svc := .Values.services }}
{{- if include "verumdoc.attivo" (dict "root" $root "svc" $svc) }}
---
{{ include "verumdoc.serviceaccount" (dict "root" $root "nome" $name "irsa" (ne (toString $svc.irsa) "false")) }}
{{- range $wn, $w := $svc.workers }}
{{- if and (ne (toString $w.enabled) "false") $w.iam }}
---
{{ include "verumdoc.serviceaccount" (dict "root" $root "nome" (printf "%s-%s" $name $wn) "irsa" true) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
