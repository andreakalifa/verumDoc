apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-db-manutenzione
  namespace: verumdoc
  labels:
    app: gateway-db-manutenzione
    app.kubernetes.io/name: gateway-db-manutenzione
    app.kubernetes.io/part-of: verumdoc
spec:
  podSelector:
    matchLabels:
      app: gateway-db-manutenzione
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress:
  - to:
    - ipBlock:
        cidr: 10.0.96.0/20
    - ipBlock:
        cidr: 10.0.112.0/20
    - ipBlock:
        cidr: 10.0.128.0/20
    ports:
    - port: 5432
      protocol: TCP
