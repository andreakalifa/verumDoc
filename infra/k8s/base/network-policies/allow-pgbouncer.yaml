apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-pgbouncer
  namespace: verumdoc
  labels:
    app: pgbouncer
    app.kubernetes.io/name: pgbouncer
    app.kubernetes.io/part-of: verumdoc
spec:
  podSelector:
    matchLabels:
      app: pgbouncer
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: gateway
    - podSelector:
        matchLabels:
          app: gateway-verifica-caricamenti
    - podSelector:
        matchLabels:
          app: validation
    - podSelector:
        matchLabels:
          app: signature
    - podSelector:
        matchLabels:
          app: aip-builder
    - podSelector:
        matchLabels:
          app: hashchain-verifica
    - podSelector:
        matchLabels:
          app: distribution
    - podSelector:
        matchLabels:
          app: distribution-lavoratori
    - podSelector:
        matchLabels:
          app: notification
    - podSelector:
        matchLabels:
          app: notification-posta
    - podSelector:
        matchLabels:
          app: notification-webhook
    - podSelector:
        matchLabels:
          app: onboarding
    - podSelector:
        matchLabels:
          app: dashboard-api
    - podSelector:
        matchLabels:
          app: dashboard-api-scarti
    - podSelector:
        matchLabels:
          app: sftp-ingest
    - podSelector:
        matchLabels:
          app: sftp-ingest-lavoratore
    - podSelector:
        matchLabels:
          app: ciclo-vita
    - podSelector:
        matchLabels:
          app: ciclo-vita-lavoratore
    - podSelector:
        matchLabels:
          app: gateway-pulizia-orfani
    - podSelector:
        matchLabels:
          app: gateway-pulizia-staging
    - podSelector:
        matchLabels:
          app: hashchain-verifica-audit
    ports:
    - port: 6432
      protocol: TCP
  egress:
  - to:
    - ipBlock:
        cidr: 10.0.96.0/20
    - ipBlock:
        cidr: 10.0.112.0/20
    - ipBlock:
        cidr: 10.0.128.0/20
    ports:
    - port: 5432
      protocol: TCP
