apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-sftp-ingest-lavoratore
  namespace: verumdoc
  labels:
    app: sftp-ingest-lavoratore
    app.kubernetes.io/name: sftp-ingest-lavoratore
    app.kubernetes.io/part-of: verumdoc
spec:
  podSelector:
    matchLabels:
      app: sftp-ingest-lavoratore
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - port: 8000
      protocol: TCP
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: gateway
    ports:
    - port: 8000
      protocol: TCP
  - to:
    - podSelector:
        matchLabels:
          app: pgbouncer
    ports:
    - port: 6432
      protocol: TCP
