apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-notification
  namespace: verumdoc
  labels:
    app: notification
    app.kubernetes.io/name: notification
    app.kubernetes.io/part-of: verumdoc
spec:
  podSelector:
    matchLabels:
      app: notification
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - ipBlock:
        cidr: 10.0.0.0/20
    - ipBlock:
        cidr: 10.0.16.0/20
    - ipBlock:
        cidr: 10.0.32.0/20
    ports:
    - port: 8000
      protocol: TCP
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: monitoring
    ports:
    - port: 8000
      protocol: TCP
  egress:
  - to:
    - podSelector:
        matchLabels:
          app: pgbouncer
    ports:
    - port: 6432
      protocol: TCP
  - to:
    - ipBlock:
        cidr: 10.0.96.0/20
    - ipBlock:
        cidr: 10.0.112.0/20
    - ipBlock:
        cidr: 10.0.128.0/20
    ports:
    - port: 6379
      protocol: TCP
  - to:
    - ipBlock:
        cidr: 10.0.96.0/20
    - ipBlock:
        cidr: 10.0.112.0/20
    - ipBlock:
        cidr: 10.0.128.0/20
    ports:
    - port: 9092
      protocol: TCP
    - port: 9094
      protocol: TCP
    - port: 9098
      protocol: TCP
