# FILE GENERATO da infra/k8s/genera_manifest.py a partire da infra/helm/values*.yaml.
# Non modificare a mano: cambiare i values e rigenerare.
# Risorsa di cluster: il file system EFS viene da Terraform (efs_file_system_id).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: verumdoc-efs
  labels:
    app.kubernetes.io/part-of: verumdoc
provisioner: efs.csi.aws.com
reclaimPolicy: Retain
volumeBindingMode: Immediate
parameters:
  provisioningMode: efs-ap
  fileSystemId: DA_TERRAFORM:efs_file_system_id
  directoryPerms: '700'
  uid: '1000'
  gid: '1000'
  basePath: /verumdoc
