apiVersion: v1
kind: ConfigMap
metadata:
  name: aip-builder-config
  namespace: verumdoc
  labels:
    app: aip-builder
    app.kubernetes.io/name: aip-builder
    app.kubernetes.io/part-of: verumdoc
data:
  ENV: production
  LOG_LEVEL: INFO
  KAFKA_BOOTSTRAP: DA_TERRAFORM:kafka_bootstrap
  KAFKA_AUTENTICAZIONE: iam
  KAFKA_REGIONE: eu-south-1
  S3_ENDPOINT_URL: https://s3.eu-south-1.amazonaws.com
  S3_REGION: eu-south-1
  S3_BUCKET_AIP: verumdoc-prod-aip-prod
  CONSERVATORE_CF: DA_IMPOSTARE
  CONSERVATORE_NOME: VerumDoc S.r.l.
  LETTURA_BLOCCO_KB: '1024'
  COPIA_MULTIPART_SOGLIA_MB: '1024'
  COPIA_PARTE_MB: '256'
