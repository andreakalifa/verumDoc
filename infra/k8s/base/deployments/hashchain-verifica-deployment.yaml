# FILE GENERATO da infra/k8s/genera_manifest.py a partire da infra/helm/values*.yaml.
# Non modificare a mano: cambiare i values e rigenerare.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hashchain-verifica
  namespace: verumdoc
  labels:
    app: hashchain-verifica
    app.kubernetes.io/name: hashchain-verifica
    app.kubernetes.io/part-of: verumdoc
    app.kubernetes.io/component: verifica
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hashchain-verifica
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: hashchain-verifica
        app.kubernetes.io/name: hashchain-verifica
        app.kubernetes.io/component: verifica
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9108'
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      serviceAccountName: hashchain-verifica
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: 60
      containers:
      - name: hashchain
        image: verumdoc-hashchain
        imagePullPolicy: IfNotPresent
        command:
        - python
        - -m
        - app.verifica_continua
        ports:
        - containerPort: 9108
          name: metriche
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        envFrom:
        - configMapRef:
            name: hashchain-config
        - secretRef:
            name: hashchain-secrets
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: hashchain-pgbouncer
              key: DATABASE_URL
        volumeMounts:
        - name: tmp
          mountPath: /tmp
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: hashchain-verifica
              topologyKey: kubernetes.io/hostname
