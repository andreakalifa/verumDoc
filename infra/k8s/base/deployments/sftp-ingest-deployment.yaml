# FILE GENERATO da infra/k8s/genera_manifest.py a partire da infra/helm/values*.yaml.
# Non modificare a mano: cambiare i values e rigenerare.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sftp-ingest
  namespace: verumdoc
  labels:
    app: sftp-ingest
    app.kubernetes.io/name: sftp-ingest
    app.kubernetes.io/part-of: verumdoc
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sftp-ingest
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: sftp-ingest
        app.kubernetes.io/name: sftp-ingest
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8000'
        prometheus.io/path: /metrics
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      serviceAccountName: sftp-ingest
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      containers:
      - name: sftp-ingest
        image: verumdoc-sftp-ingest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        - containerPort: 2222
          name: sftp
          protocol: TCP
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /api/v1/health/live
            port: http
          initialDelaySeconds: 15
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/v1/health/ready
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /api/v1/health/live
            port: http
          failureThreshold: 30
          periodSeconds: 5
        envFrom:
        - configMapRef:
            name: sftp-ingest-config
        - secretRef:
            name: sftp-ingest-secrets
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: aree
          mountPath: /var/lib/verumdoc/sftp
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 1Gi
      - name: aree
        persistentVolumeClaim:
          claimName: sftp-ingest-aree
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: sftp-ingest
              topologyKey: kubernetes.io/hostname
