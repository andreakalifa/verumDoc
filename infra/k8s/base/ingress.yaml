apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: verumdoc
  namespace: verumdoc
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443},{"HTTP":80}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: DA_IMPOSTARE:acm_certificate_arn
    alb.ingress.kubernetes.io/wafv2-acl-arn: DA_TERRAFORM:waf_web_acl_arn
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=300
spec:
  ingressClassName: alb
  rules:
  - host: api.verumdoc.it
    http:
      paths:
      - path: /api/v1/onboarding
        pathType: Prefix
        backend:
          service:
            name: onboarding
            port:
              number: 8000
      - path: /api/v1/caricamenti
        pathType: Prefix
        backend:
          service:
            name: gateway
            port:
