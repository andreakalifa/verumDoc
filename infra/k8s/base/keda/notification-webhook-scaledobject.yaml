# FILE GENERATO da infra/k8s/genera_manifest.py a partire da infra/helm/values*.yaml.
# Non modificare a mano: cambiare i values e rigenerare.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: notification-webhook-keda
  namespace: verumdoc
  labels:
    app: notification-webhook
    app.kubernetes.io/name: notification-webhook
    app.kubernetes.io/part-of: verumdoc
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: notification-webhook
  minReplicaCount: 2
  maxReplicaCount: 8
  pollingInterval: 15
  cooldownPeriod: 300
  advanced:
    horizontalPodAutoscalerConfig:
      name: notification-webhook-hpa
      behavior:
        scaleUp:
          stabilizationWindowSeconds: 60
          policies:
          - type: Pods
            value: 2
            periodSeconds: 60
        scaleDown:
          stabilizationWindowSeconds: 300
          policies:
          - type: Pods
            value: 1
            periodSeconds: 60
  triggers:
  - type: postgresql
    metadata:
      query: SELECT count(*) FROM (SELECT 1 FROM public.webhook_consegne WHERE stato IN ('IN_CODA', 'IN_CONSEGNA') AND prossimo_tentativo
        <= now() LIMIT 20000) AS coda
      targetQueryValue: '500'
      activationTargetQueryValue: '0'
    authenticationRef:
      name: keda-postgres
  - type: cpu
    metricType: Utilization
    metadata:
      value: '70'
