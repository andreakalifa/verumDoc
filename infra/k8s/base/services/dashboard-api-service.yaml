apiVersion: v1
kind: Service
metadata:
  name: dashboard-api
  namespace: verumdoc
  labels:
    app: dashboard-api
    app.kubernetes.io/name: dashboard-api
    app.kubernetes.io/part-of: verumdoc
  annotations:
    alb.ingress.kubernetes.io/healthcheck-path: /api/health/ready
spec:
  type: ClusterIP
  selector:
    app: dashboard-api
  ports:
  - name: http
    port: 8000
    targetPort: http
    protocol: TCP
