# FILE GENERATO da infra/k8s/genera_manifest.py a partire da infra/helm/values*.yaml.
# Non modificare a mano: cambiare i values e rigenerare.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: gateway-pulizia-staging
  namespace: verumdoc
  labels:
    app: gateway-pulizia-staging
    app.kubernetes.io/name: gateway-pulizia-staging
    app.kubernetes.io/part-of: verumdoc
    app.kubernetes.io/component: pulizia-staging
spec:
  schedule: 7-59/10 * * * *
  timeZone: Europe/Rome
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 540
      template:
        metadata:
          labels:
            app: gateway-pulizia-staging
            app.kubernetes.io/name: gateway-pulizia-staging
            app.kubernetes.io/component: pulizia-staging
        spec:
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            fsGroup: 1000
          serviceAccountName: gateway
          automountServiceAccountToken: true
          terminationGracePeriodSeconds: 60
          containers:
          - name: gateway
            image: verumdoc-gateway
            imagePullPolicy: IfNotPresent
            command:
            - python
            - -m
            - app.services.pulizia_staging
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
            resources:
              requests:
                cpu: 100m
                memory: 256Mi
              limits:
                cpu: 1000m
                memory: 512Mi
            envFrom:
            - configMapRef:
                name: gateway-config
            - secretRef:
                name: gateway-secrets
            env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            volumeMounts:
            - name: tmp
              mountPath: /tmp
          volumes:
          - name: tmp
            emptyDir:
              sizeLimit: 2Gi
          restartPolicy: Never
