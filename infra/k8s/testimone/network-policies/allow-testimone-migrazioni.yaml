apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-testimone-migrazioni
  namespace: verumdoc-testimone
  labels:
    app: testimone-migrazioni
    app.kubernetes.io/name: testimone-migrazioni
    app.kubernetes.io/part-of: verumdoc
spec:
  podSelector:
    matchLabels:
      app: testimone-migrazioni
  policyTypes:
  - Ingress
  - Egress
  ingress: []
  egress:
  - to:
    - ipBlock:
        cidr: 10.20.96.0/20
    - ipBlock:
        cidr: 10.20.112.0/20
    - ipBlock:
        cidr: 10.20.128.0/20
    ports:
    - port: 5432
      protocol: TCP
