# FILE GENERATO da infra/k8s/genera_manifest.py a partire da infra/helm/values*.yaml.
# Non modificare a mano: cambiare i values e rigenerare.
# Account del testimone (R04, K3): namespace, quota e limiti propri.
apiVersion: v1
kind: Namespace
metadata:
  name: verumdoc-testimone
  labels:
    project: verumdoc
    environment: production
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: verumdoc-testimone-quota
  namespace: verumdoc-testimone
spec:
  hard:
    requests.cpu: '4'
    requests.memory: 8Gi
    limits.cpu: '8'
    limits.memory: 8Gi
    pods: '20'
    services: '5'
---
apiVersion: v1
kind: LimitRange
metadata:
  name: verumdoc-testimone-limiti
  namespace: verumdoc-testimone
spec:
  limits:
  - type: Container
    default:
      cpu: 500m
      memory: 512Mi
    defaultRequest:
      cpu: 100m
      memory: 128Mi
    max:
      cpu: '2'
      memory: 4Gi
    min:
      cpu: 50m
      memory: 64Mi
