# FILE GENERATO da infra/k8s/genera_manifest.py a partire da infra/helm/values*.yaml.
# Non modificare a mano: cambiare i values e rigenerare.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: verumdoc
  namespace: verumdoc-testimone
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443},{"HTTP":80}]'
    alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/certificate-arn: DA_IMPOSTARE:acm_certificate_arn_testimone
    alb.ingress.kubernetes.io/wafv2-acl-arn: DA_IMPOSTARE:waf_web_acl_arn_testimone
    alb.ingress.kubernetes.io/load-balancer-attributes: idle_timeout.timeout_seconds=300
spec:
  ingressClassName: alb
  rules:
  - host: testimone.verumdoc.it
    http:
      paths:
      - path: /api/v1/testimone
        pathType: Prefix
        backend:
          service:
            name: testimone
            port:
              number: 8000
