# VerumDoc — prova di carico del versamento (R04, VD-C-081 parte carico)
#
# Manuale (workflow_dispatch), mai su push: consuma risorse e, con k6, scrive
# versamenti di prova nell'ambiente indicato.
#   giornata (R12) tools/carico/k6/giornata_milione.js: 1 milione di documenti in
#           una giornata con curva oraria, compressa di «compressione» volte (input
#           ritmo = compressione, durata = ore della curva), campione fino a CONSERVATO
#   k6      tools/carico/k6/versamenti.js contro un ambiente REALE (staging):
#           PostgreSQL dietro PgBouncer, S3 con Object Lock, Kafka. Soglie del
#           piano §2 (presa in carico p95 ≤ 2 s): se non rispettate il job fallisce.
#           Credenziale: segreto VD_CARICO_TOKEN (token di servizio dell'ente di
#           prova con scope versamento:ud) o VD_CARICO_API_KEY.
#   locale  tools/carico/prova_locale.py sul runner: gateway reale (uvicorn),
#           PostgreSQL e Redis reali, S3 moto, Kafka assente. Misura il codice su
#           una macchina nota (runner da 4 core), non l'esercizio.

name: Carico

on:
  workflow_dispatch:
    inputs:
      modalita:
        description: "k6 (ambiente reale) oppure locale (runner)"
        type: choice
        options: [k6, giornata, locale]
        default: k6
      url:
        description: "Base dell'API per k6 (es. https://api.staging.verumdoc.it)"
        type: string
        default: "https://api.staging.verumdoc.it"
      ritmo:
        description: "Versamenti al secondo (k6) o livelli separati da virgole (locale)"
        type: string
        default: "50"
      durata:
        description: "Durata (k6: es. 1h; locale: secondi per livello)"
        type: string
        default: "1h"

permissions:
  contents: read

concurrency:
  group: carico-${{ github.ref }}
  cancel-in-progress: false

jobs:
  giornata:
    if: inputs.modalita == 'giornata'
    runs-on: ubuntu-24.04
    timeout-minutes: 1440
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: "0.54.0"

      - name: Giornata da 1 milione di documenti (curva oraria, compressa)
        env:
          VD_URL: ${{ inputs.url }}
          VD_TOKEN: ${{ secrets.VD_CARICO_TOKEN }}
          VD_API_KEY: ${{ secrets.VD_CARICO_API_KEY }}
          COMPRESSIONE: ${{ inputs.ritmo }}
          ORE: ${{ inputs.durata }}
        run: |
          k6 run --summary-export riepilogo-giornata.json tools/carico/k6/giornata_milione.js

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: carico-giornata
          path: riepilogo-giornata.json
          if-no-files-found: ignore

  k6:
    if: inputs.modalita == 'k6'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: grafana/setup-k6-action@v1
        with:
          k6-version: "0.54.0"

      - name: Scenario versamenti (multipart, sessioni di caricamento, stato)
        env:
          VD_URL: ${{ inputs.url }}
          VD_TOKEN: ${{ secrets.VD_CARICO_TOKEN }}
          VD_API_KEY: ${{ secrets.VD_CARICO_API_KEY }}
          RITMO: ${{ inputs.ritmo }}
          DURATA: ${{ inputs.durata }}
        run: |
          k6 run --summary-export riepilogo-k6.json tools/carico/k6/versamenti.js

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: carico-k6
          path: riepilogo-k6.json
          if-no-files-found: ignore

  locale:
    if: inputs.modalita == 'locale'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: r04_carico
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d r04_carico"
          --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/gateway/pyproject.toml

      - name: Ambiente del gateway e del generatore
        run: |
          python -m venv .venv-carico
          .venv-carico/bin/pip install -q -e "services/gateway[dev]" "moto[server]>=5.1,<6" "aiohttp==3.*"

      - name: Schema del database (alembic upgrade head)
        working-directory: services/gateway
        env:
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/r04_carico
        run: ../../.venv-carico/bin/python -m alembic upgrade head

      - name: Prova locale
        run: |
          livelli="${{ inputs.ritmo }}"; [ "$livelli" = "50" ] && livelli="10,25,50"
          durata="${{ inputs.durata }}"; case "$durata" in *[!0-9]*) durata=180;; esac
          .venv-carico/bin/python tools/carico/prova_locale.py \
            --database-url postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/r04_carico \
            --redis-url redis://127.0.0.1:6379/0 \
            --livelli "$livelli" --durata "$durata" --worker 4 --riavvia-s3 \
            --python "$PWD/.venv-carico/bin/python" --uscita risultati-carico

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: carico-locale
          path: risultati-carico
          if-no-files-found: ignore
