    azione: Versare con le interfacce di VerumDoc (REST, sessioni di caricamento, PDND, SFTP), descritte in docs/integrazione/README.md.
    esito: ERRORE
    ritentabile: true
    retry_after: 5
    dismesso: true

  # ── RGL: motore delle regole ───────────────────────────────────────
  RGL-101:
    famiglia: RGL
    status: 422
    titolo: Metadato minimo dell'Allegato 5 mancante
    descrizione: Regola (rilievo in `dettagli.rilievi` di VRS-130 o fra gli `avvisi`). Il documento principale non ha uno dei metadati minimi dell'Allegato 5 alle Linee guida AgID. Regola bloccante imposta dalla norma (locked).
    azione: Valorizzare il metadato indicato in `campo` nei `parametri` del documento principale.
    esito: RIFIUTATO
    ritentabile: false
  RGL-102:
    famiglia: RGL
    status: 422
    titolo: Metadato obbligatorio della classe mancante
    descrizione: Regola (rilievo in `dettagli.rilievi` di VRS-130 o fra gli `avvisi`). Il documento principale non ha un metadato obbligatorio per la classe documentale o per il suo profilo di metadati.
    azione: Valorizzare il metadato indicato in `campo` (nei `parametri` o in `parametri.metadati_extra`).
    esito: RIFIUTATO
    ritentabile: false
  RGL-103:
    famiglia: RGL
    status: 422
    titolo: Metadato non previsto
    descrizione: Regola (predefinito AVVISA, fra gli `avvisi`; se configurata per bloccare, rilievo di VRS-130). Un metadato dei `parametri` non è previsto né dallo schema né dal profilo della classe; è conservato così come versato, mai scartato.
    azione: Verificare il nome del metadato o chiedere di aggiungerlo al profilo della classe.
    esito: NON_VALIDO
    ritentabile: false
  RGL-104:
    famiglia: RGL
    status: 422
    titolo: File oltre la dimensione massima della classe
    descrizione: Regola (rilievo in `dettagli.rilievi` di VRS-130 o fra gli `avvisi`). Un file supera la dimensione massima per file della classe documentale.
    azione: Ridurre il file o versarlo in una classe che lo ammette.
    esito: RIFIUTATO
    ritentabile: false
  RGL-105:
    famiglia: RGL
    status: 422
    titolo: Formato non ammesso dalla classe documentale
    descrizione: Regola (rilievo in `dettagli.rilievi` di VRS-130 o fra gli `avvisi`). Il formato riconosciuto dal contenuto del file non è fra quelli ammessi dalla classe. Sostituisce VRS-112.
    azione: Convertire il file in uno dei formati ammessi indicati nel messaggio.
    esito: RIFIUTATO
    ritentabile: false
  RGL-106:
    famiglia: RGL
    status: 422
    titolo: Metadato di tipo non valido
    descrizione: Regola (rilievo in `dettagli.rilievi` di VRS-130 o fra gli `avvisi`). Un metadato del profilo della classe non rispetta il tipo previsto (data, numero, codice fiscale, partita IVA, codice IPA, valori ammessi). Il messaggio non riporta il valore.
    azione: Correggere il valore del metadato indicato in `campo`.
    esito: RIFIUTATO
    ritentabile: false
  RGL-107:
    famiglia: RGL
    status: 422
    titolo: Formato rifiutato dal catalogo dei formati
    descrizione: "Regola (rilievo in `dettagli.rilievi` di VRS-130, o del passo 10 della verifica con VLD-1002). Il formato del file, riconosciuto dal contenuto (MIME al versamento, PUID PRONOM e veraPDF nella verifica), ha esito RIFIUTATO nel catalogo dei formati (FORMATO.<ID>.ESITO del conservatore, dell'ente o della classe; R08, D02)."
    azione: Convertire il file in un formato ammesso dal catalogo (vedi il validatore preventivo, `file_rifiutati`).
    esito: RIFIUTATO
    ritentabile: false
  RGL-108:
    famiglia: RGL
    status: 422
    titolo: Formato ammesso con avviso o da convertire
    descrizione: Avviso (fra gli `avvisi`, poi nel rapporto di versamento). Il formato del file ha esito AVVISO o DA_CONVERTIRE nel catalogo dei formati (R08, D02).
    azione: Nessuna per il versamento; pianificare la conversione dei file segnalati.
    esito: NON_VALIDO
    ritentabile: false
  RGL-109:
    famiglia: RGL
    status: 422
    titolo: Firme insufficienti per il livello di verifica
    descrizione: "Regola valutata dalla verifica (passo 11, VLD-1101 se bloccante; altrimenti fra gli avvisi del RdV). La firma di un file non soddisfa FIRME_LIVELLO_VERIFICA della classe (RILEVATA, CRITTOGRAFICA, CON_REVOCHE): il motivo in parole è nel messaggio, l'esito normalizzato nel rapporto di verifica (R08, D01)."
    azione: Versare il documento con una firma valida, di un certificato non revocato e riconducibile a un prestatore fidato.
    esito: RIFIUTATO
    ritentabile: false
  RGL-113:
    famiglia: RGL
    status: 422
    titolo: Firma indeterminata ammessa con avviso
    descrizione: "Regola valutata dalla verifica (passo 11): una firma INDETERMINATE (firma integra e catena attendibile, ma per esempio certificato scaduto o revoca non determinabile) che il conservatore ha scelto di ammettere con avviso (FIRME_INDETERMINATE_EFFETTO = AVVISA). Con il valore predefinito (BLOCCA) le firme indeterminate sono rilievi di RGL-109 (revisione R08, X1)."
    azione: Nessuna azione obbligatoria; verificare il certificato del firmatario e, se possibile, versare il documento con una firma valida o con marca temporale.
    esito: NON_VALIDO
    ritentabile: false
  RGL-503:
    famiglia: RGL
    status: 503
    titolo: Configurazione delle regole non valida
    descrizione: Un valore di configurazione del motore delle regole (impostazione o profilo di metadati) salvato per il cliente o la classe non è valido; il versamento è sospeso per non applicare regole indovinate.
    azione: Segnalare al conservatore indicando l'identificativo della richiesta.
    esito: ERRORE
    ritentabile: true
    retry_after: 300
  RGL-110:
    famiglia: RGL
    status: 422
    titolo: Impostazioni personalizzate per il versamento
    descrizione: Avviso (fra gli `avvisi`, mai una risposta HTTP). Il versamento porta una personalizzazione motivata delle impostazioni (`override` dell'indice, livello PDV); motivo e valori sono nella fotografia delle regole del PdV e nel rapporto di versamento.
    azione: Nessuna; verificare che la personalizzazione sia voluta.
    esito: NON_VALIDO
    ritentabile: false
  RGL-111:
    famiglia: RGL
    status: 422
    titolo: Personalizzazione del versamento non ammessa
    descrizione: L'`override` dell'indice non è ammesso. Motivo mancante o più corto di 10 caratteri, impostazione sconosciuta, non personalizzabile sul singolo versamento (imposta dalla norma, riservata al conservatore o fuori dal suo ambito), oppure valore del tipo sbagliato. L'elenco è in `dettagli.problemi`.
    azione: Correggere o togliere l'`override` e reinviare.
    esito: NON_VALIDO
    ritentabile: false
  RGL-112:
    famiglia: RGL
    status: 422
    titolo: Accordo di versamento non valido
    descrizione: L'accordo indicato nel campo `accordo` dell'indice non esiste per l'ente, non è in vigore nel giorno del versamento o non vale per la classe documentale. Il servizio non sceglie un altro accordo al suo posto.
    azione: Indicare un accordo in vigore per la classe, oppure omettere `accordo` per usare quello dell'ente.
    esito: NON_VALIDO
    ritentabile: false

  # ── CFG: configurazione (R05 Q1) ───────────────────────────────────
  CFG-400:
    famiglia: CFG
    status: 400
    titolo: Richiesta di configurazione non valida
    descrizione: La bozza, l'ambito o il cursore non sono coerenti (livello non ammesso per la risorsa, ente o classe mancanti, cursore alterato). Il motivo è nel dettaglio.
    azione: Correggere la richiesta.
    esito: NON_VALIDO
    ritentabile: false
  CFG-403:
    famiglia: CFG
    status: 403
    titolo: Modifica della configurazione non consentita
    descrizione: Il ruolo non può modificare la configurazione a quel livello (il conservatore configura i livelli CONSERVATORE ed ENTE; l'amministratore dell'ente i livelli ENTE, CLASSE e ACCORDO del proprio ente).
    azione: Chiedere a chi ha il ruolo adatto.
    esito: RIFIUTATO
    ritentabile: false
  CFG-404:
    famiglia: CFG
    status: 404
    titolo: Elemento della configurazione non trovato
    descrizione: La bozza, la proposta, l'ente, la classe o il profilo non esistono o non sono visibili a chi chiede.
    azione: Verificare l'identificativo.
    esito: NON_VALIDO
    ritentabile: false
  CFG-409:
    famiglia: CFG
    status: 409
    titolo: Piano cambiato
    descrizione: "PIANO_CAMBIATO. Dall'anteprima la configurazione è cambiata (un'altra modifica applicata, la bozza aggiornata): l'impronta del piano non coincide e nulla è stato scritto. Il piano nuovo è in `dettagli.piano`."
    azione: Rileggere il piano e ripetere l'applicazione con la nuova `impronta_piano`.
    esito: RIFIUTATO
    ritentabile: false
  CFG-410:
    famiglia: CFG
    status: 409
    titolo: Bozza modificata da altri
    descrizione: La versione della bozza indicata non è quella attuale. La versione attuale è in `dettagli.versione`.
    azione: Rileggere la bozza e ripetere la modifica.
    esito: RIFIUTATO
    ritentabile: false
  CFG-411:
    famiglia: CFG
    status: 409
    titolo: Bozza non più modificabile
    descrizione: La bozza è già stata applicata o annullata.
    azione: Creare una nuova bozza.
    esito: RIFIUTATO
    ritentabile: false
  CFG-412:
    famiglia: CFG
    status: 409
    titolo: Proposta già decisa
    descrizione: La proposta è già stata accettata o rifiutata.
    azione: Nessuna.
    esito: RIFIUTATO
    ritentabile: false
  CFG-422:
    famiglia: CFG
    status: 422
    titolo: Piano con elementi bloccati
    descrizione: "L'anteprima ha elementi bloccati (valore imposto dalla norma, fuori ambito, tipo errato, permessi): la bozza non si applica. L'elenco è in `dettagli.bloccati`."
    azione: Correggere la bozza togliendo gli elementi bloccati.
    esito: NON_VALIDO
    ritentabile: false
  CFG-423:
    famiglia: CFG
    status: 422
    titolo: Decorrenza non ammessa
    descrizione: "La data `valido_dal` non è ammessa. Gli accordi e i profili decorrono da oggi o da una data futura (mai nel passato né prima della versione precedente); R07 (D28): le impostazioni di conservatore, ente e classe si possono programmare da una data futura (la bozza diventa PROGRAMMATA); le proposte valgono dall'applicazione."
    azione: Indicare una decorrenza ammessa o ometterla.
    esito: NON_VALIDO
    ritentabile: false
  CFG-424:
    famiglia: CFG
    status: 409
    titolo: Modifica programmata non annullabile
    descrizione: "R07 (D28): la bozza non è programmata (già applicata, annullata o ancora aperta) e non si può annullare come modifica programmata."
    azione: Rileggere lo stato della bozza.
    esito: RIFIUTATO
    ritentabile: false
  CFG-503:
    famiglia: CFG
    status: 503
    titolo: Configurazione temporaneamente non disponibile
    descrizione: Il database non ha risposto o la configurazione salvata non è leggibile; nulla è stato scritto.
    azione: Ritentare più tardi; se persiste, segnalare al conservatore con l'identificativo della richiesta.
    esito: ERRORE
    ritentabile: true
    retry_after: 30
  # ── VAL / HTTP / INTERNAL ──────────────────────────────────────────
  VAL-422:
    famiglia: VAL
    status: 422
    titolo: Richiesta non conforme allo schema
    descrizione: Uno o più campi mancano o hanno un tipo o un formato errato; l'elenco è in `campi`.
    azione: Correggere i campi indicati e reinviare.
    esito: NON_VALIDO
    ritentabile: false
  HTTP-400:
    famiglia: HTTP
    status: 400
    titolo: Richiesta non valida
    descrizione: La richiesta non è valida.
    azione: Correggere la richiesta.
    esito: NON_VALIDO
    ritentabile: false
  HTTP-401:
    famiglia: HTTP
    status: 401
    titolo: Autenticazione richiesta
    descrizione: La richiesta richiede credenziali valide.
    azione: Inviare credenziali valide.
    esito: NON_VALIDO
    ritentabile: false
  HTTP-403:
    famiglia: HTTP
    status: 403
    titolo: Operazione non consentita
    descrizione: Le credenziali non consentono l'operazione.
    azione: Usare credenziali abilitate.
    esito: RIFIUTATO
    ritentabile: false
  HTTP-404:
    famiglia: HTTP
    status: 404
    titolo: Risorsa non trovata
    descrizione: L'indirizzo o la risorsa richiesta non esistono.
    azione: Verificare l'indirizzo e l'identificativo.
    esito: NON_VALIDO
    ritentabile: false
  HTTP-405:
    famiglia: HTTP
    status: 405
    titolo: Metodo non ammesso
    descrizione: Il metodo HTTP non è ammesso su questo indirizzo.
    azione: Usare uno dei metodi indicati nell'intestazione Allow.
    esito: NON_VALIDO
    ritentabile: false
  HTTP-406:
    famiglia: HTTP
    status: 406
    titolo: Formato di risposta non disponibile
    descrizione: Il formato richiesto nell'intestazione Accept non è disponibile.
    azione: Accettare uno dei formati offerti.
    esito: NON_VALIDO
    ritentabile: false
  HTTP-409:
    famiglia: HTTP
    status: 409
    titolo: Conflitto
    descrizione: La richiesta è in conflitto con lo stato della risorsa.
    azione: Ricaricare la risorsa e ripetere se ancora necessario.
    esito: RIFIUTATO
    ritentabile: false
  HTTP-413:
    famiglia: HTTP
    status: 413
    titolo: Richiesta troppo grande
    descrizione: Il corpo della richiesta supera la dimensione ammessa.
    azione: Ridurre la richiesta.
    esito: NON_VALIDO
    ritentabile: false
  HTTP-415:
    famiglia: HTTP
    status: 415
    titolo: Tipo di contenuto non supportato
    descrizione: Il tipo di contenuto della richiesta non è supportato.
    azione: Inviare il corpo nel formato atteso.
    esito: NON_VALIDO
    ritentabile: false
  HTTP-422:
    famiglia: HTTP
    status: 422
    titolo: Richiesta non elaborabile
    descrizione: La richiesta è ben formata ma non elaborabile.
    azione: Correggere il contenuto della richiesta.
    esito: NON_VALIDO
    ritentabile: false
  HTTP-429:
    famiglia: HTTP
    status: 429
    titolo: Troppe richieste
    descrizione: Sono state inviate troppe richieste.
    azione: Attendere e riprovare.
    esito: ERRORE
    ritentabile: true
    retry_after: 60
  HTTP-500:
    famiglia: HTTP
    status: 500
    titolo: Errore del servizio
    descrizione: Il servizio ha restituito un errore senza codice.
    azione: Segnalare al conservatore indicando l'identificativo della richiesta.
    esito: ERRORE
    ritentabile: false
  HTTP-501:
    famiglia: HTTP
    status: 501
    titolo: Funzione non disponibile
    descrizione: La funzione richiesta non è disponibile.
    azione: Concordare l'operazione con il conservatore.
    esito: RIFIUTATO
    ritentabile: false
  HTTP-502:
    famiglia: HTTP
    status: 502
    titolo: Servizio interno non raggiungibile
    descrizione: Un servizio interno non ha risposto correttamente.
    azione: Riprovare tra poco.
    esito: ERRORE
    ritentabile: true
  HTTP-503:
    famiglia: HTTP
    status: 503
    titolo: Servizio temporaneamente non disponibile
    descrizione: Il servizio non è al momento disponibile.
    azione: Riprovare tra poco.
    esito: ERRORE
    ritentabile: true
    retry_after: 30
  HTTP-504:
    famiglia: HTTP
    status: 504
    titolo: Tempo di risposta superato
    descrizione: Un servizio interno non ha risposto in tempo.
    azione: Riprovare tra poco.
    esito: ERRORE
    ritentabile: true
  INTERNAL-001:
    famiglia: INTERNAL
    status: 500
    titolo: Errore interno del servizio
    descrizione: Errore non previsto; il dettaglio è nei log del conservatore.
    azione: Segnalare al conservatore indicando l'identificativo della richiesta.
    esito: ERRORE
    ritentabile: false

  # ── WH: webhook firmati (agente R03 b3) ────────────────────────────
  WH-001:
    famiglia: WH
    status: 422
    titolo: Indirizzo del webhook non valido
    descrizione: L'indirizzo non è un URL https assoluto, contiene credenziali o un frammento, oppure supera la lunghezza ammessa.
    azione: Indicare un URL https assoluto senza utente, password e frammento (#).
    esito: NON_VALIDO
    ritentabile: false
  WH-002:
    famiglia: WH
    status: 422
    titolo: Indirizzo del webhook non ammesso
    descrizione: L'indirizzo punta a una rete privata, di loopback, locale o riservata (protezione SSRF).
    azione: Indicare un indirizzo raggiungibile su Internet.
    esito: RIFIUTATO
    ritentabile: false
  WH-003:
    famiglia: WH
    status: 422
    titolo: Tipo di evento sconosciuto
    descrizione: Fra i tipi di evento della sottoscrizione ce n'è uno che non esiste nel catalogo degli eventi.
    azione: Usare solo i tipi elencati nella documentazione dei webhook (`dettagli.ammessi`).
    esito: NON_VALIDO
    ritentabile: false
  WH-004:
    famiglia: WH
    status: 409
    titolo: Numero massimo di webhook raggiunto
    descrizione: L'ente ha già il numero massimo di sottoscrizioni ammesse.
    azione: Eliminare una sottoscrizione non più usata o aggiungere i tipi di evento a una esistente.
    esito: RIFIUTATO
    ritentabile: false
  WH-010:
    famiglia: WH
    status: 404
    titolo: Consegna non trovata
    descrizione: La consegna non esiste per questa sottoscrizione e questo ente.
    azione: Verificare gli identificativi della sottoscrizione e della consegna.
    esito: NON_VALIDO
    ritentabile: false
  WH-011:
    famiglia: WH
    status: 409
    titolo: Consegna non ripetibile
    descrizione: Si può ripetere solo una consegna FALLITA (ritentativi esauriti); lo stato attuale è in `dettagli.stato`.
    azione: Attendere l'esito dei ritentativi automatici.
    esito: RIFIUTATO
    ritentabile: false
  WH-012:
    famiglia: WH
    status: 422
    titolo: Consegna oltre la retention
    descrizione: La consegna riguarda un evento più vecchio della retention degli eventi per i clienti (RETENZIONE_EVENTI_CLIENTE_GIORNI) e non si può più ripetere; data dell'evento e retention in `dettagli`.
    azione: Recuperare lo stato attuale della risorsa con le API di consultazione.
    esito: RIFIUTATO
    ritentabile: false
  WH-013:
    famiglia: WH
    status: 409
    titolo: Nessuna rotazione in corso
    descrizione: Il webhook non ha un segreto precedente ancora valido da ritirare.
    azione: Nessuna; per un segreto nuovo usare la rotazione.
    esito: RIFIUTATO
    ritentabile: false
  WH-030:
    famiglia: WH
    status: 503
    titolo: Webhook non disponibili in questo ambiente
    descrizione: La chiave di cifratura dei segreti dei webhook non è configurata.
    azione: Usare l'elenco degli eventi (GET /api/v1/eventi) o segnalare al conservatore.
    esito: ERRORE
    ritentabile: false
  WH-101:
    famiglia: WH
    status: 504
    titolo: Tempo di risposta del destinatario superato
    descrizione: Esito di una consegna (campo `ultimo_codice`). Il sistema del cliente non ha risposto entro il tempo massimo.
    azione: Rispondere 2xx subito e lavorare l'evento dopo; la consegna sarà ritentata.
    esito: ERRORE
    ritentabile: true
    contesto: asincrono
  WH-102:
    famiglia: WH
    status: 502
    titolo: Connessione al destinatario non riuscita
    descrizione: Esito di una consegna. Nome non risolto, connessione rifiutata o certificato TLS non valido.
    azione: Verificare l'indirizzo, il DNS e il certificato del sistema che riceve; la consegna sarà ritentata.
    esito: ERRORE
    ritentabile: true
    contesto: asincrono
  WH-103:
    famiglia: WH
    status: 502
    titolo: Risposta non positiva del destinatario
    descrizione: Esito di una consegna. Il destinatario ha risposto con uno stato diverso da 2xx (i reindirizzamenti non si seguono); lo stato è in `ultimo_stato_http`.
    azione: Rispondere 2xx quando l'evento è stato ricevuto; la consegna sarà ritentata.
    esito: ERRORE
    ritentabile: true
    contesto: asincrono
  WH-104:
    famiglia: WH
    status: 422
    titolo: Indirizzo risolto non ammesso
    descrizione: Esito di una consegna. Al momento dell'invio il nome del destinatario risolveva verso un indirizzo privato, di loopback o riservato (protezione SSRF); la consegna non è partita.
    azione: Correggere il DNS o l'indirizzo del webhook, poi ripetere la consegna.
    esito: RIFIUTATO
    ritentabile: false
    contesto: asincrono
  WH-106:
    famiglia: WH
    status: 500
    titolo: Segreto del webhook non leggibile
    descrizione: Esito di una consegna. Il segreto della sottoscrizione non si può decifrare con le chiavi configurate; la consegna non è partita.
    azione: Segnalare al conservatore; eliminare e ricreare il webhook per ottenere un nuovo segreto.
    esito: ERRORE
    ritentabile: false
    contesto: asincrono
  WH-404:
    famiglia: WH
    status: 404
    titolo: Webhook non trovato
    descrizione: La sottoscrizione non esiste, è stata eliminata o appartiene a un altro ente.
    azione: Verificare l'identificativo della sottoscrizione.
    esito: NON_VALIDO
    ritentabile: false
  WH-503:
    famiglia: WH
    status: 503
    titolo: Gestione dei webhook temporaneamente non disponibile
    descrizione: Il database dei webhook non ha risposto.
    azione: Riprovare tra poco.
    esito: ERRORE
    ritentabile: true
    retry_after: 30

  # ── EVT: elenco degli eventi (agente R03 b3) ───────────────────────
  EVT-001:
    famiglia: EVT
    status: 422
    titolo: Tipo di evento sconosciuto
    descrizione: Il filtro `tipo` contiene un tipo di evento che non esiste nel catalogo degli eventi.
    azione: Usare solo i tipi elencati nella documentazione (`dettagli.ammessi`).
    esito: NON_VALIDO
    ritentabile: false
  EVT-503:
    famiglia: EVT
    status: 503
    titolo: Elenco degli eventi temporaneamente non disponibile
    descrizione: Il database degli eventi non ha risposto.
    azione: Riprovare tra poco con lo stesso cursore.
    esito: ERRORE
    ritentabile: true
    retry_after: 30
  # ── SFTP: canale di versamento via SFTP (agente R03 b2) ─────────────
  SFTP-001:
    famiglia: SFTP
    status: 422
    titolo: Chiave pubblica SSH non valida
    descrizione: Il testo inviato non è una chiave pubblica in formato OpenSSH («tipo base64 [commento]») oppure il tipo dichiarato non corrisponde al contenuto.
    azione: Incollare la riga del file .pub generato con ssh-keygen.
    esito: NON_VALIDO
    ritentabile: false
  SFTP-002:
    famiglia: SFTP
    status: 422
    titolo: Tipo o lunghezza della chiave non ammessi
    descrizione: Sono ammesse solo chiavi dei tipi e delle lunghezze consentiti dal servizio (ed25519, ecdsa, rsa di almeno 3072 bit con le impostazioni predefinite).
    azione: Generare una chiave ammessa (es. ssh-keygen -t ed25519) e registrarla.
    esito: RIFIUTATO
    ritentabile: false
  SFTP-003:
    famiglia: SFTP
    status: 409
    titolo: Chiave già registrata per l'account
    descrizione: Fra le chiavi attive dell'account ce n'è già una con la stessa impronta.
    azione: Nessuna; per sostituirla revocare prima quella esistente.
    esito: NON_VALIDO
    ritentabile: false
  SFTP-004:
    famiglia: SFTP
    status: 409
    titolo: Nome utente SFTP non disponibile
    descrizione: Il nome di accesso scelto è già in uso (i nomi sono unici fra tutti gli enti).
    azione: Scegliere un altro nome utente.
    esito: NON_VALIDO
    ritentabile: false
  SFTP-404:
    famiglia: SFTP
    status: 404
    titolo: Account o chiave SFTP non trovati
    descrizione: L'account o la chiave indicati non esistono in questo ente.
    azione: Verificare gli identificativi.
    esito: NON_VALIDO
    ritentabile: false
  SFTP-409:
    famiglia: SFTP
    status: 409
    titolo: Operazione non ammessa nello stato dell'account
    descrizione: L'operazione richiede un account (o un utente responsabile) in uno stato diverso da quello attuale, ad esempio la riattivazione di un account il cui responsabile non è più attivo.
    azione: Leggere il dettaglio; se serve indicare un altro utente responsabile.
    esito: RIFIUTATO
    ritentabile: false
  SFTP-503:
    famiglia: SFTP
    status: 503
    titolo: Gestione degli account SFTP temporaneamente non disponibile
    descrizione: Il database non ha risposto.
    azione: Riprovare tra poco; se il problema continua comunicare l'identificativo della richiesta.
    esito: ERRORE
    ritentabile: true
    retry_after: 30
  SFTP-101:
    famiglia: SFTP
    status: 422
    titolo: Indice della cartella assente
    descrizione: La cartella di versamento non contiene il file indice.json.
    azione: Caricare la cartella con indice.json e rinominarla di nuovo.
    esito: NON_VALIDO
    ritentabile: false
    contesto: asincrono
  SFTP-102:
    famiglia: SFTP
    status: 422
    titolo: Indice della cartella non leggibile
    descrizione: indice.json non è un oggetto JSON valido in UTF-8 oppure supera la dimensione massima ammessa.
    azione: Correggere indice.json (stesso schema dell'indice dell'API REST) e reinviare la cartella.
    esito: NON_VALIDO
    ritentabile: false
    contesto: asincrono
  SFTP-103:
    famiglia: SFTP
    status: 422
    titolo: File dichiarato nell'indice assente dalla cartella
    descrizione: Un nome_file dell'indice non corrisponde ad alcun file della cartella.
    azione: Caricare tutti i file dichiarati (stesso nome, maiuscole comprese) e reinviare la cartella.
    esito: NON_VALIDO
    ritentabile: false
    contesto: asincrono
  SFTP-104:
    famiglia: SFTP
    status: 422
    titolo: File della cartella non dichiarato nell'indice
    descrizione: La cartella contiene un file che l'indice non dichiara.
    azione: Togliere il file o dichiararlo nell'indice e reinviare la cartella.
    esito: NON_VALIDO
    ritentabile: false
    contesto: asincrono
  SFTP-105:
    famiglia: SFTP
    status: 422
    titolo: Contenuto della cartella non ammesso
    descrizione: La cartella contiene sottocartelle, collegamenti, file temporanei non rinominati oppure un nome_file dell'indice non è un semplice nome di file.
    azione: Una cartella per pacchetto, solo file a un livello con nomi semplici; reinviare la cartella.
    esito: NON_VALIDO
    ritentabile: false
    contesto: asincrono
  SFTP-201:
    famiglia: SFTP
    status: 503
    titolo: Servizio di versamento non raggiungibile
    descrizione: Il canale SFTP non è riuscito a consegnare il pacchetto al servizio di versamento dopo tutti i tentativi previsti (rete, tempi di risposta, risposte non interpretabili).
    azione: Reinviare la stessa cartella più tardi; il reinvio non crea duplicati.
    esito: ERRORE
    ritentabile: true
    contesto: asincrono
  SFTP-202:
    famiglia: SFTP
    status: 503
    titolo: Verifica dei file caricati non conclusa
    descrizione: La verifica dei file caricati (impronte e formato) non si è conclusa entro il tempo previsto.
    azione: Nessuna se lo stato è IN_RIPROVA; altrimenti reinviare la stessa cartella più tardi.
    esito: ERRORE
    ritentabile: true
    contesto: asincrono
  SFTP-500:
    famiglia: SFTP
    status: 500
    titolo: Errore interno del canale SFTP
    descrizione: Errore non previsto durante la lavorazione della cartella; il dettaglio è nei log del conservatore.
    azione: Nessuna se lo stato è IN_RIPROVA; altrimenti segnalare al conservatore con l'identificativo della lavorazione.
    esito: ERRORE
    ritentabile: true
    contesto: asincrono

  # ── TST: testimone indipendente della catena (R04) ─────────────────
  TST-400:
    famiglia: TST
    status: 400
    titolo: Richiesta di controfirma non valida
    descrizione: Il corpo non rispetta il protocollo del testimone (riga «old», righe della prova in base64, checkpoint in formato signed note) oppure la dimensione precedente supera quella del checkpoint.
    azione: Correggere il client del registro secondo il protocollo K3 e reinviare.
    esito: NON_VALIDO
    ritentabile: false
  TST-401:
    famiglia: TST
    status: 401
    titolo: Registro non autenticato
    descrizione: Manca il token di servizio del registro oppure non è fra quelli accettati dal testimone.
    azione: Configurare nel registro il token concordato con il testimone (TESTIMONE_TOKEN).
    esito: RIFIUTATO
    ritentabile: false
  TST-403:
    famiglia: TST
    status: 403
    titolo: Firma del registro non valida
    descrizione: Il checkpoint non porta una firma valida della chiave del registro configurata nel testimone.
    azione: Verificare che il registro firmi con la chiave pubblicata e che il testimone abbia la chiave pubblica corretta.
    esito: RIFIUTATO
    ritentabile: false
  TST-404:
    famiglia: TST
    status: 404
    titolo: Checkpoint non trovato
    descrizione: Il testimone non ha controfirmato alcun checkpoint con l'origine o la dimensione richieste.
    azione: Controllare origine e dimensione; il testimone conserva solo i checkpoint che ha controfirmato.
    esito: NON_VALIDO
    ritentabile: false
  TST-405:
    famiglia: TST
    status: 404
    titolo: Origine del registro non ammessa
    descrizione: L'origine del checkpoint (prima riga) non è fra quelle che questo testimone osserva.
    azione: Usare l'origine dell'ambiente corretto o aggiungerla alle origini ammesse del testimone.
    esito: RIFIUTATO
    ritentabile: false
  TST-409:
    famiglia: TST
    status: 409
    titolo: Dimensione precedente non coincidente
    descrizione: La dimensione «old» indicata dal registro non è l'ultima controfirmata dal testimone. Per compatibilità con il protocollo tlog-witness il corpo della risposta è text/plain con la sola dimensione nota al testimone.
    azione: Ricalcolare la prova di consistenza a partire dalla dimensione restituita e reinviare.
    esito: NON_VALIDO
    ritentabile: false
  TST-413:
    famiglia: TST
    status: 413
    titolo: Richiesta di controfirma troppo grande
    descrizione: Il corpo supera la dimensione massima o il numero massimo di righe della prova ammessi dal testimone.
    azione: Controllare il client del registro; una prova di consistenza ha al più qualche decina di righe.
    esito: NON_VALIDO
    ritentabile: false
  TST-422:
    famiglia: TST
    status: 422
    titolo: Prova di consistenza non valida
    descrizione: La prova non dimostra che il nuovo checkpoint estende l'ultimo controfirmato. L'esito è registrato come allarme del testimone.
    azione: Verificare il registro (un registro integro produce sempre una prova valida). Se la prova è corretta, segnalare al conservatore.
    esito: RIFIUTATO
    ritentabile: false
  TST-423:
    famiglia: TST
    status: 423
    titolo: Testimone bloccato per incoerenza del registro
    descrizione: Il testimone ha ricevuto due checkpoint firmati dal registro con la stessa dimensione e radici diverse (fork) e non controfirma più nulla finché un operatore del testimone non interviene.
    azione: Avviare la procedura di incidente della catena; lo sblocco è solo manuale e registrato.
    esito: RIFIUTATO
    ritentabile: false
  TST-500:
    famiglia: TST
    status: 500
    titolo: Errore interno del testimone
    descrizione: Errore non previsto del testimone; il dettaglio è solo nei log con l'identificativo della richiesta.
    azione: Ritentare più tardi; se persiste segnalare con l'identificativo della richiesta.
    esito: ERRORE
    ritentabile: true
  TST-503:
    famiglia: TST
    status: 503
    titolo: Testimone non disponibile
    descrizione: Il database del testimone non risponde o il testimone non è configurato (chiave, chiave del registro).
    azione: Ritentare più tardi.
    esito: ERRORE
    ritentabile: true
    retry_after: 30

  # ── IDEM: Idempotency-Key fuori dal versamento (R04 servizi, VD-C-106) ─
  IDEM-400:
    famiglia: IDEM
    status: 400
    titolo: Idempotency-Key non valida
    descrizione: "L'intestazione Idempotency-Key deve avere da 8 a 200 caratteri fra lettere, cifre e i segni punto, trattino basso, due punti e trattino (stessa regola del versamento)."
    azione: Correggere la chiave; usarne una nuova per ogni operazione diversa.
    esito: NON_VALIDO
    ritentabile: false
  IDEM-409:
    famiglia: IDEM
    status: 409
    titolo: Idempotency-Key già usata con una richiesta diversa
    descrizione: La stessa Idempotency-Key è già stata usata, entro la sua validità, con un corpo diverso. Nessuna risorsa nuova è stata creata.
    azione: Usare una nuova chiave per una richiesta diversa; per ripetere la stessa richiesta inviare lo stesso corpo.
    esito: NON_VALIDO
    ritentabile: false
  IDEM-409-IN-CORSO:
    famiglia: IDEM
    status: 409
    titolo: Richiesta con la stessa Idempotency-Key in corso
    descrizione: Una richiesta identica con la stessa chiave è ancora in elaborazione.
    azione: Ripetere la richiesta dopo l'attesa indicata in Retry-After; riceverà lo stesso esito.
    esito: ERRORE
    ritentabile: true
    retry_after: 2

  # ── R04 servizi: code di scarto, fruitori PDND, voucher monouso ────────
  DSH-404-SCARTO:
    famiglia: DSH
    status: 404
    titolo: Messaggio scartato non trovato
    descrizione: Nessun messaggio delle code di scarto ha questo identificativo.
    azione: Rileggere l'elenco delle code di scarto.
    esito: NON_VALIDO
    ritentabile: false
  DSH-409-SCARTO:
    famiglia: DSH
    status: 409
    titolo: Messaggio scartato già gestito
    descrizione: Il messaggio è già stato rielaborato o archiviato, anche da un'altra persona, e lo stato atteso non coincide.
    azione: Rileggere il dettaglio del messaggio.
    esito: RIFIUTATO
    ritentabile: false
  DSH-409-PIANO:
    famiglia: DSH
    status: 409
    titolo: Piano cambiato
    descrizione: Il piano di rielaborazione ricalcolato al momento dell'applicazione non coincide con l'anteprima confermata (impronta del piano diversa). Nulla è stato applicato; la risposta contiene il piano aggiornato.
    azione: Controllare il piano aggiornato e confermarlo di nuovo.
    esito: RIFIUTATO
    ritentabile: false
  DSH-422-PIANO:
    famiglia: DSH
    status: 422
    titolo: Selezione da rielaborare non valida
    descrizione: Indicare almeno un messaggio scartato o un filtro, entro il massimo di elementi per piano.
    azione: Correggere la selezione.
    esito: NON_VALIDO
    ritentabile: false
  GOV-404-FRUITORE:
    famiglia: GOV
    status: 404
    titolo: Fruitore PDND non trovato
    descrizione: Nessun fruitore PDND registrato con questo identificativo.
    azione: Verificare l'identificativo.
    esito: NON_VALIDO
    ritentabile: false
  GOV-409-FRUITORE:
    famiglia: GOV
    status: 409
    titolo: Client PDND già registrato
    descrizione: Il client_id PDND è già associato a un fruitore (di questo o di un altro ente).
    azione: Usare il fruitore esistente o disattivarlo prima di registrarne un altro.
    esito: RIFIUTATO
    ritentabile: false
  PDND-401-RIUSATO:
    famiglia: PDND
    status: 401
    titolo: Voucher PDND già usato
    descrizione: Il voucher (identificato dal suo jti) è già stato presentato; ogni voucher vale per una sola richiesta, oppure non ha il claim jti.
    azione: Richiedere un nuovo voucher a PDND per ogni richiesta.
    esito: NON_VALIDO
    ritentabile: false
  PDND-503-REPLAY:
    famiglia: PDND
    status: 503
    titolo: Controllo dei voucher non disponibile
    descrizione: Il registro dei voucher già usati non risponde; per sicurezza il voucher non è accettato.
    azione: Ritentare con un nuovo voucher tra poco.
    esito: ERRORE
    ritentabile: true
    retry_after: 5

  # ── INT: verifica continua dell'integrità (R04) ─────────────────────
  INT-400:
    famiglia: INT
    status: 400
    titolo: Cursore del registro delle verifiche non valido
    descrizione: Il cursore indicato non è nel formato emesso dal servizio (copiato male o costruito a mano).
    azione: Ripartire dalla prima pagina senza cursore e usare il campo `cursore_successivo` della risposta.
    esito: NON_VALIDO
    ritentabile: false
  INT-403:
    famiglia: INT
    status: 403
    titolo: Ruolo non autorizzato a richiedere verifiche d'integrità
    descrizione: Le verifiche su richiesta le avviano il personale del conservatore (SUPER_ADMIN, RSC_CONSERVATORE) e l'amministratore dell'ente sui propri pacchetti.
    azione: Chiedere la verifica a un utente con il ruolo adatto.
    esito: RIFIUTATO
    ritentabile: false
  INT-404:
    famiglia: INT
    status: 404
    titolo: Pacchetto, ente o richiesta di verifica non trovati
    descrizione: Uno o più PdA indicati, l'ente o la richiesta di verifica non esistono o non sono visibili con le credenziali usate.
    azione: Controllare gli identificativi (URN o id del PdA, id dell'ente, id della richiesta).
    esito: NON_VALIDO
    ritentabile: false
  INT-409:
    famiglia: INT
    status: 409
    titolo: Verifica dell'ente già in corso
    descrizione: Per l'ente è già attiva una verifica di tutti i pacchetti; una seconda rileggerebbe gli stessi oggetti.
    azione: Seguire lo stato della richiesta indicata in `dettagli.richiesta_id`.
    esito: RIFIUTATO
    ritentabile: false
  INT-422:
    famiglia: INT
    status: 422
    titolo: Richiesta di verifica non valida
    descrizione: Va indicato un elenco di PdA (al più il numero ammesso) oppure un ente, non entrambi né nessuno dei due.
    azione: Correggere il corpo della richiesta e reinviarla.
    esito: NON_VALIDO
    ritentabile: false
  INT-503:
    famiglia: INT
    status: 503
    titolo: Registro delle verifiche non disponibile
    descrizione: Il database del servizio non ha risposto; nessuna verifica avviata o letta.
    azione: Ritentare più tardi.
    esito: ERRORE
    ritentabile: true
    retry_after: 30
  ACC-401:
    famiglia: ACC
    status: 401
    titolo: "Accesso non riuscito"
    descrizione: "Indirizzo e-mail, password o codice non corretti, oppure accesso temporaneamente bloccato dopo troppi tentativi. Il messaggio è lo stesso in ogni caso: non rivela se l'utente esiste."
    azione: "Controllare i dati e riprovare; dopo il blocco attendere qualche minuto."
    esito: RIFIUTATO
    ritentabile: false
  ACC-403-METODO:
    famiglia: ACC
    status: 403
    titolo: "Metodo d'accesso non ammesso"
    descrizione: "L'ente non ammette questo metodo d'accesso, o il conservatore non l'ha abilitato."
    azione: "Accedere con un metodo ammesso dall'ente o chiedere all'amministratore dell'ente."
    esito: RIFIUTATO
    ritentabile: false
  ACC-400-PASSAGGIO:
    famiglia: ACC
    status: 400
    titolo: "Passaggio scaduto o già usato"
    descrizione: "Il passaggio dell'accesso o dell'attivazione non è valido, è scaduto o è stato iniziato in un altro browser."
    azione: "Ricominciare l'accesso o riaprire il collegamento d'invito."
    esito: NON_VALIDO
    ritentabile: false
  ACC-404-INVITO:
    famiglia: ACC
    status: 404
    titolo: "Invito non valido"
    descrizione: "Il collegamento d'invito non è valido, è scaduto, è già stato usato o l'indirizzo e-mail non corrisponde."
    azione: "Chiedere un nuovo invito all'amministratore dell'ente."
    esito: RIFIUTATO
    ritentabile: false
  ACC-409-INVITO:
    famiglia: ACC
    status: 409
    titolo: "Invito non possibile"
    descrizione: "L'utente è già attivo, oppure l'indirizzo e-mail è già usato nell'ente."
    azione: "Controllare l'elenco degli utenti dell'ente."
    esito: RIFIUTATO
    ritentabile: false
  ACC-422-PASSWORD:
    famiglia: ACC
    status: 422
    titolo: "Password non ammessa"
    descrizione: "La password non rispetta la lunghezza minima o le altre regole indicate."
    azione: "Scegliere una password più lunga."
    esito: NON_VALIDO
    ritentabile: false
  ACC-422-CODICE:
    famiglia: ACC
    status: 422
    titolo: "Codice a tempo non valido"
    descrizione: "Il codice a sei cifre non corrisponde o è già stato usato."
    azione: "Inserire il codice attuale dell'app di autenticazione."
    esito: NON_VALIDO
    ritentabile: false
  ACC-400-PASSKEY:
    famiglia: ACC
    status: 400
    titolo: "Passkey non verificata"
    descrizione: "La passkey non è stata riconosciuta o la firma non è valida."
    azione: "Riprovare o accedere con un altro metodo."
    esito: RIFIUTATO
    ritentabile: false
  ACC-422-FORNITORE:
    famiglia: ACC
    status: 422
    titolo: "Configurazione del fornitore non valida"
    descrizione: "Mancano campi obbligatori o un indirizzo non è https."
    azione: "Correggere la configurazione e salvare di nuovo."
    esito: NON_VALIDO
    ritentabile: false
  ACC-429:
    famiglia: ACC
    status: 429
    titolo: "Troppi tentativi"
    descrizione: "Troppi tentativi d'accesso da questo indirizzo in poco tempo."
    azione: "Attendere qualche minuto e riprovare."
    esito: ERRORE
    ritentabile: true
    retry_after: 900
  ACC-403-CREDENZIALI:
    famiglia: ACC
    status: 403
    titolo: "Gestione delle credenziali non disponibile"
    descrizione: "Le proprie credenziali si gestiscono solo da una sessione personale della console (non con una chiave API o un token di canale), oppure l'ente ammette solo SPID o CIE, oppure il metodo chiesto non è ammesso dall'ente."
    azione: "Accedere alla console con la propria utenza; con solo SPID o CIE le credenziali si gestiscono presso il gestore dell'identità digitale."
    esito: RIFIUTATO
    ritentabile: false
  ACC-403-RIAUTENTICAZIONE:
    famiglia: ACC
    status: 403
    titolo: "Conferma dell'identità richiesta"
    descrizione: "Ogni modifica delle credenziali, e ogni decisione sensibile del ciclo di vita (R17), richiede di confermare la propria identità da poco (password e codice a tempo, o passkey; con solo SPID o CIE l'accesso appena fatto) in questa sessione; la conferma è scaduta, manca o è già stata usata per un'altra decisione."
    azione: "Confermare l'identità e ripetere l'operazione entro la finestra indicata."
    esito: RIFIUTATO
    ritentabile: false
  ACC-403-CONFERMA-DECISIONE:
    famiglia: ACC
    status: 403
    titolo: "Conferma della decisione non concessa"
    descrizione: "Il gateway firma la conferma di una decisione sensibile (scarto, annullamento, rettifica, riversamento in uscita, ripresa) solo per una sessione personale della console, per un'azione del proprio ruolo e del proprio ente (o del conservatore), dopo una conferma dell'identità recente in questa sessione; ogni conferma dell'identità vale per UNA sola decisione."
    azione: "Confermare di nuovo la propria identità e ripetere la decisione; per un'azione di un altro ruolo, farla fare a chi ne ha titolo."
    esito: RIFIUTATO
    ritentabile: false
  ACC-422-CONFERMA-DECISIONE:
    famiglia: ACC
    status: 422
    titolo: "Richiesta di conferma non valida"
    descrizione: "L'azione, la pratica, la versione attesa o l'impronta del contenuto indicate non sono valide (impronta SHA-256 esadecimale; una richiesta che crea la pratica non indica pratica né versione)."
    azione: "Ricaricare la pagina e ripetere la decisione."
    esito: NON_VALIDO
    ritentabile: false
  ACC-503-CONFERMA-DECISIONE:
    famiglia: ACC
    status: 503
    titolo: "Conferma delle decisioni non disponibile"
    descrizione: "La chiave con cui il gateway firma le conferme delle decisioni non è configurata o non è valida: nessuna decisione sensibile si conferma (fail-closed)."
    azione: "Segnalare all'operatore dell'infrastruttura: chiave CONFERME_CHIAVE_PRIVATA e CONFERME_KID nel Secret del gateway (runbook conferme_decisione)."
    esito: ERRORE
    ritentabile: true
    retry_after: 60
  ACC-422-RIAUTENTICAZIONE:
    famiglia: ACC
    status: 422
