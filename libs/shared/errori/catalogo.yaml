  VLD-1001:
    famiglia: VLD
    status: 422
    titolo: Eseguibile riconosciuto dal contenuto
    descrizione: Un file del PdV è un eseguibile o uno script (firma binaria), qualunque sia il nome (R08, D02).
    azione: Togliere il file dal versamento.
    esito: RIFIUTATO
    ritentabile: false
    contesto: asincrono
  VLD-1002:
    famiglia: VLD
    status: 422
    titolo: Formato rifiutato dal catalogo dei formati
    descrizione: "Il passo 10 della verifica ha identificato (PRONOM, veraPDF) un formato con esito RIFIUTATO nel catalogo fotografato al versamento; i rilievi RGL-107 sono in `dettagli.rilievi`."
    azione: Convertire il file in un formato ammesso e versare di nuovo.
    esito: RIFIUTATO
    ritentabile: false
    contesto: asincrono
  VLD-1100:
    famiglia: VLD
    status: 500
    titolo: Errore interno nel passo 11 della verifica
    descrizione: La verifica delle firme è terminata con un'eccezione non prevista.
    azione: Segnalare al conservatore; il PdV sarà riverificato.
    esito: ERRORE
    ritentabile: true
    contesto: asincrono
  VLD-1101:
    famiglia: VLD
    status: 422
    titolo: Firme insufficienti per il livello richiesto
    descrizione: "Il passo 11 della verifica ha trovato firme che non soddisfano il livello della classe (RGL-109 bloccante); il rapporto di verifica con l'esito di ogni firma è in `dettagli.rapporto`."
    azione: Versare i documenti con firme valide al livello richiesto.
    esito: RIFIUTATO
    ritentabile: false
    contesto: asincrono
