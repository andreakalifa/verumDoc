    esito: RIFIUTATO
    ritentabile: false
  DL-403-CONTENUTO:
    famiglia: DL
    status: 403
    titolo: Contenuto di un altro ente non accessibile
    descrizione: Anche i profili del conservatore leggono solo i metadati dei pacchetti di altri enti.
    azione: Scaricare solo i contenuti del proprio ente.
