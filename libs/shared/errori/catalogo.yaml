    esito: RIFIUTATO
    ritentabile: false
  FSC-403-RUOLO:
    famiglia: FSC
    status: 403
    titolo: Profilo non abilitato alla modifica dei fascicoli
    descrizione: Il profilo può consultare i fascicoli ma non crearli o modificarli.
    azione: Chiedere l'operazione a un utente abilitato.
    esito: RIFIUTATO
    ritentabile: false
  FSC-404:
    famiglia: FSC
    status: 404
    titolo: Fascicolo non trovato
    descrizione: Il fascicolo non esiste o non appartiene al cliente.
    azione: Verificare l'identificativo.
    esito: NON_VALIDO
    ritentabile: false
  FSC-405:
    famiglia: FSC
    status: 404
    titolo: Pacchetto non trovato
    descrizione: Il pacchetto da aggiungere al fascicolo non esiste o non appartiene al cliente.
