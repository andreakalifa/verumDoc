    esito: RIFIUTATO
    ritentabile: false
  FSC-422-RESPONSABILE:
    famiglia: FSC
    status: 422
    titolo: Responsabile non valido
    descrizione: Il responsabile deve essere un utente attivo dello stesso ente.
