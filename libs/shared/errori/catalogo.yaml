    famiglia: VLD
    status: 500
    titolo: Errore interno nel passo 9 della verifica
    descrizione: Il passo di verifica è terminato con un'eccezione non prevista.
    azione: Segnalare al conservatore; il PdV sarà riverificato.
    esito: ERRORE
    ritentabile: true
    contesto: asincrono
  VLD-101:
    famiglia: VLD
    status: 422
    titolo: Classe documentale mancante nell'indice
    descrizione: L'indice non indica la classe documentale.
    azione: Indicare la classe documentale e versare di nuovo.
    esito: NON_VALIDO
    ritentabile: false
    contesto: asincrono
  VLD-102:
    famiglia: VLD
    status: 422
    titolo: Nessun documento nell'indice
    descrizione: L'indice non elenca alcun documento.
    azione: Elencare i documenti dell'unità documentaria e versare di nuovo.
    esito: NON_VALIDO
    ritentabile: false
    contesto: asincrono
  VLD-103:
    famiglia: VLD
    status: 422
    titolo: Campo obbligatorio mancante nel documento
    descrizione: Un documento dell'indice manca di un campo obbligatorio.
    azione: Completare il campo indicato e versare di nuovo.
    esito: NON_VALIDO
    ritentabile: false
    contesto: asincrono
  VLD-104:
    famiglia: VLD
    status: 422
    titolo: Impronta incompleta
    descrizione: L'impronta di un documento non indica valore e algoritmo.
    azione: Indicare impronta e algoritmo e versare di nuovo.
    esito: NON_VALIDO
    ritentabile: false
    contesto: asincrono
  VLD-201:
    famiglia: VLD
    status: 422
    titolo: Documenti duplicati
    descrizione: Lo stesso documento compare più volte nell'unità documentaria.
    azione: Togliere i duplicati e versare di nuovo.
    esito: NON_VALIDO
    ritentabile: false
    contesto: asincrono
  VLD-202:
    famiglia: VLD
    status: 422
    titolo: Nome file duplicato
    descrizione: Due documenti hanno lo stesso nome file.
    azione: Dare nomi univoci ai file e versare di nuovo.
    esito: NON_VALIDO
    ritentabile: false
    contesto: asincrono
  VLD-301:
    famiglia: VLD
    status: 422
    titolo: Documento principale mancante
    descrizione: L'unità documentaria non ha un documento principale.
    azione: Indicare il documento principale e versare di nuovo.
    esito: NON_VALIDO
    ritentabile: false
    contesto: asincrono
  VLD-302:
    famiglia: VLD
    status: 422
    titolo: Più documenti principali
    descrizione: L'unità documentaria ha più di un documento principale.
    azione: Lasciare un solo documento principale e versare di nuovo.
    esito: NON_VALIDO
    ritentabile: false
    contesto: asincrono
  VLD-401:
    famiglia: VLD
    status: 422
    titolo: Formato non ammesso
    descrizione: Uno o più documenti hanno un formato non ammesso per la conservazione.
    azione: Convertire i file in un formato ammesso e versare di nuovo.
    esito: RIFIUTATO
    ritentabile: false
    contesto: asincrono
  VLD-501:
    famiglia: VLD
    status: 422
    titolo: Verifica delle impronte fallita
    descrizione: L'impronta ricalcolata di uno o più file non corrisponde a quella dichiarata.
    azione: Verificare i file e le impronte e versare di nuovo.
    esito: NON_VALIDO
    ritentabile: false
    contesto: asincrono
  VLD-502:
    famiglia: VLD
    status: 422
    titolo: File nello storage diverso da quello versato
    descrizione: Il file letto dallo storage di transito non ha la dimensione o le impronte misurate dal gateway durante il versamento (file alterato o sostituito dopo la ricezione); l'elenco è in `dettagli.errori`.
    azione: Versare di nuovo l'unità documentaria; se si ripete, segnalare al conservatore.
    esito: NON_VALIDO
    ritentabile: false
    contesto: asincrono
  VLD-601:
    famiglia: VLD
    status: 422
    titolo: Metadati non conformi
    descrizione: I metadati dell'Allegato 5 non sono conformi; l'elenco per campo è in `dettagli.errori`.
    azione: Correggere i campi indicati e versare di nuovo.
    esito: NON_VALIDO
    ritentabile: false
    contesto: asincrono
  VLD-701:
    famiglia: VLD
    status: 422
    titolo: Classe documentale mancante
    descrizione: La classe documentale non è indicata.
    azione: Indicare la classe documentale e versare di nuovo.
    esito: NON_VALIDO
    ritentabile: false
    contesto: asincrono
  VLD-702:
    famiglia: VLD
    status: 422
    titolo: Classe documentale non attiva
    descrizione: La classe documentale non è attiva per il cliente.
    azione: Chiedere l'attivazione della classe al conservatore.
    esito: RIFIUTATO
    ritentabile: false
    contesto: asincrono
  VLD-703:
    famiglia: VLD
    status: 422
    titolo: Classe documentale non censita
    descrizione: La classe documentale non è censita per il cliente.
    azione: Chiedere la configurazione della classe al conservatore.
    esito: RIFIUTATO
    ritentabile: false
    contesto: asincrono
  VLD-705:
    famiglia: VLD
    status: 422
    titolo: Identificativo del cliente non valido
    descrizione: Il PdV porta un identificativo del cliente non valido.
    azione: Segnalare al conservatore.
    esito: ERRORE
    ritentabile: false
    contesto: asincrono
  VLD-801:
    famiglia: VLD
    status: 422
    titolo: File oltre il limite di dimensione
    descrizione: Uno o più file superano la dimensione massima ammessa.
    azione: Ridurre i file o concordare il limite col conservatore.
    esito: RIFIUTATO
    ritentabile: false
    contesto: asincrono
  VLD-802:
    famiglia: VLD
    status: 500
    titolo: Regole applicate al PdV non leggibili
    descrizione: La fotografia delle regole salvata al versamento (`regole_applicate`) non è interpretabile; la verifica non sostituisce valori indovinati e si ferma.
    azione: Nessuna per il cliente; il conservatore corregge e rielabora il PdV.
    esito: ERRORE
    ritentabile: false
    contesto: asincrono
  VLD-901:
    famiglia: VLD
    status: 422
    titolo: Anno non valido
    descrizione: L'anno della chiave dell'unità documentaria è fuori dall'intervallo ammesso.
    azione: Correggere l'anno e versare di nuovo.
    esito: NON_VALIDO
    ritentabile: false
    contesto: asincrono
  VLD-902:
    famiglia: VLD
    status: 422
    titolo: Anno non numerico
    descrizione: L'anno della chiave dell'unità documentaria non è un numero intero.
    azione: Correggere l'anno e versare di nuovo.
    esito: NON_VALIDO
    ritentabile: false
    contesto: asincrono
  VLD-903:
    famiglia: VLD
    status: 422
    titolo: Numero del documento vuoto
    descrizione: Il numero della chiave dell'unità documentaria è presente ma vuoto.
    azione: Indicare il numero o ometterlo e versare di nuovo.
    esito: NON_VALIDO
    ritentabile: false
    contesto: asincrono
  VLD-EVT-000:
    famiglia: VLD
    status: 500
    titolo: Evento di verifica non leggibile
    descrizione: Il messaggio ricevuto dalla pipeline non è un oggetto JSON.
    azione: Nessuna per il cliente; il conservatore analizza l'evento.
    esito: ERRORE
    ritentabile: false
    contesto: asincrono
  VLD-EVT-001:
    famiglia: VLD
    status: 500
    titolo: Evento di verifica con identificativi non validi
    descrizione: L'evento non porta identificativi validi di PdV o cliente.
    azione: Nessuna per il cliente; il conservatore analizza l'evento.
    esito: ERRORE
    ritentabile: false
    contesto: asincrono
  VLD-EVT-002:
    famiglia: VLD
    status: 500
    titolo: Evento di verifica senza indice
    descrizione: L'evento non contiene l'indice del PdV.
    azione: Nessuna per il cliente; il conservatore analizza l'evento.
    esito: ERRORE
    ritentabile: false
    contesto: asincrono
  VLD-EVT-003:
    famiglia: VLD
    status: 500
    titolo: PdV dell'evento inesistente
    descrizione: Il PdV indicato dall'evento non esiste per il cliente.
    azione: Nessuna per il cliente; il conservatore analizza l'evento.
    esito: ERRORE
    ritentabile: false
    contesto: asincrono

  # ── AIP: costruzione del PdA ───────────────────────────────────────
  AIP-EVENTO-001:
    famiglia: AIP
    status: 500
    titolo: Evento di costruzione non leggibile
    descrizione: Il messaggio ricevuto non è un oggetto JSON.
    azione: Nessuna per il cliente; il conservatore analizza l'evento.
    esito: ERRORE
    ritentabile: false
    contesto: asincrono
  AIP-EVENTO-002:
    famiglia: AIP
    status: 500
    titolo: Evento di costruzione con identificativi non validi
    descrizione: L'evento non porta identificativi validi di PdV o cliente.
    azione: Nessuna per il cliente; il conservatore analizza l'evento.
    esito: ERRORE
    ritentabile: false
    contesto: asincrono
  AIP-EVENTO-003:
    famiglia: AIP
    status: 500
    titolo: Indice senza documenti
    descrizione: L'indice del PdV da archiviare non contiene documenti.
    azione: Nessuna per il cliente; il conservatore analizza l'evento.
    esito: ERRORE
    ritentabile: false
    contesto: asincrono
  AIP-PDV-001:
    famiglia: AIP
    status: 500
    titolo: PdV inesistente
    descrizione: Il PdV da archiviare non esiste per il cliente indicato.
    azione: Nessuna per il cliente; il conservatore analizza l'evento.
    esito: ERRORE
    ritentabile: false
    contesto: asincrono
  AIP-PDV-002:
    famiglia: AIP
    status: 500
    titolo: PdV in uno stato che non ammette l'archiviazione
    descrizione: Il PdV non è nello stato richiesto per costruire il PdA.
    azione: Nessuna per il cliente; il conservatore analizza l'evento.
    esito: ERRORE
    ritentabile: false
    contesto: asincrono
  AIP-INTEGRITA-001:
    famiglia: AIP
    status: 500
    titolo: Algoritmo d'impronta non ammesso
    descrizione: L'algoritmo d'impronta del file non è fra quelli ammessi.
    azione: Segnalare al conservatore.
    esito: ERRORE
    ritentabile: false
    contesto: asincrono
  AIP-INTEGRITA-002:
    famiglia: AIP
    status: 500
    titolo: Impronta non corrispondente
    descrizione: L'impronta ricalcolata sul file in archiviazione non corrisponde a quella dichiarata.
    azione: Segnalare al conservatore.
    esito: ERRORE
    ritentabile: false
    contesto: asincrono
  AIP-INTEGRITA-003:
    famiglia: AIP
    status: 500
    titolo: Dimensione del file non corrispondente
    descrizione: Il file letto ha una dimensione diversa da quella versata.
    azione: Segnalare al conservatore.
    esito: ERRORE
    ritentabile: false
    contesto: asincrono
  AIP-METADATI-001:
    famiglia: AIP
    status: 500
    titolo: Metadati insufficienti per il PdA
    descrizione: Mancano metadati necessari a costruire il PdA (es. modalità di formazione).
    azione: Segnalare al conservatore.
    esito: ERRORE
    ritentabile: false
    contesto: asincrono
  AIP-FILE-001:
    famiglia: AIP
    status: 500
    titolo: File del documento non referenziato
    descrizione: Un documento dell'indice non ha il riferimento al file nello storage.
    azione: Segnalare al conservatore.
    esito: ERRORE
    ritentabile: false
    contesto: asincrono
  AIP-STORAGE-001:
    famiglia: AIP
    status: 500
    titolo: Oggetto già presente con contenuto diverso
    descrizione: Lo storage conservativo contiene già un oggetto con la stessa chiave ma contenuto diverso.
    azione: Segnalare al conservatore.
    esito: ERRORE
    ritentabile: false
    contesto: asincrono

  AIP-STORAGE-002:
    famiglia: AIP
    status: 500
    titolo: Copia nello storage conservativo non corrispondente
    descrizione: La copia del file nello storage conservativo non ha l'impronta o la dimensione del file versato (verifica dopo la copia lato storage).
    azione: Segnalare al conservatore.
    esito: ERRORE
    ritentabile: false
    contesto: asincrono

  # ── SEC: controlli d'ingresso ──────────────────────────────────────
  SEC-001:
    famiglia: SEC
    status: 400
    titolo: Testo troppo lungo
    descrizione: Un testo supera la lunghezza massima ammessa.
    azione: Accorciare il testo e reinviare.
    esito: NON_VALIDO
    ritentabile: false
  SEC-002:
    famiglia: SEC
    status: 400
    titolo: Testo con sequenze non ammesse
    descrizione: Un testo contiene sequenze tipiche di un'iniezione SQL.
    azione: Togliere le sequenze non ammesse e reinviare.
    esito: NON_VALIDO
    ritentabile: false
  SEC-003:
    famiglia: SEC
    status: 400
    titolo: Testo con marcatori non ammessi
    descrizione: Un testo contiene marcatori HTML o script non ammessi.
    azione: Togliere i marcatori e reinviare.
    esito: NON_VALIDO
    ritentabile: false
  SEC-004:
    famiglia: SEC
    status: 400
    titolo: Percorso non ammesso
    descrizione: Un nome contiene sequenze di attraversamento di cartelle.
    azione: Usare un nome semplice, senza separatori di cartella.
    esito: NON_VALIDO
    ritentabile: false
  SEC-005:
    famiglia: SEC
    status: 400
    titolo: Indirizzo non ammesso
    descrizione: L'indirizzo punta a una rete interna o non ammessa.
    azione: Indicare un indirizzo pubblico raggiungibile.
    esito: RIFIUTATO
    ritentabile: false
  SEC-006:
    famiglia: SEC
    status: 400
    titolo: Estensione del file non ammessa
    descrizione: L'estensione del nome file non è fra quelle ammesse.
    azione: Usare un file con un'estensione ammessa.
    esito: NON_VALIDO
    ritentabile: false

  # ── AUTH ───────────────────────────────────────────────────────────
  AUTH-000:
    famiglia: AUTH
    status: 401
    titolo: Autenticazione richiesta
    descrizione: La richiesta non porta credenziali.
    azione: Inviare un token Bearer o una chiave API.
    esito: NON_VALIDO
    ritentabile: false
  AUTH-001:
    famiglia: AUTH
    status: 401
    titolo: Credenziali non valide
    descrizione: Il token o la chiave API non sono validi o sono stati revocati.
    azione: Ottenere un nuovo token o verificare la chiave API.
    esito: NON_VALIDO
    ritentabile: false
  AUTH-002:
    famiglia: AUTH
    status: 401
    titolo: Credenziali scadute
    descrizione: Il token o la chiave API sono scaduti.
    azione: Rinnovare il token (nuovo accesso) o la chiave API.
    esito: NON_VALIDO
    ritentabile: false
  AUTH-003:
    famiglia: AUTH
    status: 401
    titolo: Accesso revocato
    descrizione: L'utenza o l'ente non sono più attivi, oppure il ruolo è cambiato.
    azione: Accedere di nuovo o rivolgersi all'amministratore.
    esito: RIFIUTATO
    ritentabile: false
  AUTH-004:
    famiglia: AUTH
    status: 401
    titolo: Sessione scaduta per inattività
    descrizione: La sessione del portale è rimasta inattiva oltre il limite (30 minuti, 15 per i ruoli privilegiati) oppure è stata chiusa.
    azione: Accedere di nuovo dal portale.
    esito: RIFIUTATO
    ritentabile: false
  AUTH-010:
    famiglia: AUTH
    status: 403
    titolo: Permessi insufficienti
    descrizione: Il ruolo dell'utente non consente l'operazione.
    azione: Chiedere l'operazione a un utente con il ruolo adeguato.
    esito: RIFIUTATO
    ritentabile: false
  AUTH-011:
    famiglia: AUTH
    status: 403
    titolo: Scope non autorizzato
    descrizione: Il token o la chiave non hanno lo scope richiesto dall'operazione.
    azione: Usare credenziali con lo scope richiesto.
    esito: RIFIUTATO
    ritentabile: false
  AUTH-020:
    famiglia: AUTH
    status: 403
    titolo: Accesso negato a questo ente
    descrizione: L'utente non può operare sui dati dell'ente indicato.
    azione: Operare solo sui dati del proprio ente.
    esito: RIFIUTATO
    ritentabile: false
  AUTH-021:
    famiglia: AUTH
    status: 403
    titolo: Cliente non determinabile dal token
    descrizione: Il token non indica un cliente valido.
    azione: Usare un token emesso per un utente di un ente.
    esito: RIFIUTATO
    ritentabile: false
  AUTH-030:
    famiglia: AUTH
    status: 503
    titolo: Chiavi API non disponibili
    descrizione: Le chiavi API non si possono verificare in questo ambiente (configurazione incompleta).
    azione: Usare l'accesso con token o segnalare al conservatore.
    esito: ERRORE
    ritentabile: false
  AUTH-040:
    famiglia: AUTH
    status: 403
    titolo: Richiesta non protetta contro la falsificazione
    descrizione: >-
      Richiesta che modifica dati con la sessione del portale (cookie) senza il
      token anti-CSRF corrispondente o da un'origine diversa da quella del portale.
    azione: >-
      Ripetere l'operazione dal portale (la pagina invia il token X-CSRF-Token);
      i sistemi versanti usano il token Bearer o la chiave API, non il cookie.
    esito: RIFIUTATO
    ritentabile: false
  AUTH-041:
    famiglia: AUTH
    status: 400
    titolo: Credenziali duplicate o contrastanti
    descrizione: >-
      La richiesta presenta più di una credenziale dello stesso tipo (più
      intestazioni Authorization o X-Api-Key) oppure il cookie della sessione e
      un token Bearer diversi: non si sceglie quale usare.
    azione: Inviare una sola credenziale per richiesta.
    esito: RIFIUTATO
    ritentabile: false
  AUTH-503:
    famiglia: AUTH
    status: 503
    titolo: Verifica dell'accesso non disponibile
    descrizione: Il controllo di revoca non si è potuto eseguire.
    azione: Riprovare tra poco.
    esito: ERRORE
    ritentabile: true
    retry_after: 30

  # ── SPID ───────────────────────────────────────────────────────────
  SPID-001:
    famiglia: SPID
    status: 503
    titolo: Aggregatore SPID/CIE non configurato
    descrizione: L'accesso con SPID o CIE non è configurato in questo ambiente.
    azione: Usare un altro metodo d'accesso o segnalare al conservatore.
    esito: ERRORE
    ritentabile: false
  SPID-002:
    famiglia: SPID
    status: 400
    titolo: Accesso scaduto o già concluso
    descrizione: Lo stato dell'accesso non è valido (scaduto o già usato).
    azione: Ripetere l'accesso.
    esito: NON_VALIDO
    ritentabile: false
  SPID-003:
    famiglia: SPID
    status: 401
    titolo: Accesso annullato o rifiutato
    descrizione: Il gestore dell'identità ha annullato o rifiutato l'accesso.
    azione: Ripetere l'accesso.
    esito: RIFIUTATO
    ritentabile: false
  SPID-004:
    famiglia: SPID
    status: 502
    titolo: Errore nello scambio con l'aggregatore
    descrizione: L'aggregatore non ha risposto correttamente.
    azione: Ripetere l'accesso tra poco.
    esito: ERRORE
    ritentabile: true
  SPID-005:
    famiglia: SPID
    status: 401
    titolo: Identità digitale non verificata
    descrizione: L'asserzione dell'identità non ha superato le verifiche.
    azione: Ripetere l'accesso.
    esito: RIFIUTATO
    ritentabile: false
  SPID-006:
    famiglia: SPID
    status: 400
    titolo: Accesso iniziato in un altro browser o scaduto
    descrizione: L'accesso è stato avviato in un altro browser o è scaduto.
    azione: Ripetere l'accesso da questo browser.
    esito: NON_VALIDO
    ritentabile: false
  SPID-007:
    famiglia: SPID
    status: 401
    titolo: Codice fiscale assente o non valido
    descrizione: L'identità digitale non contiene un codice fiscale valido.
    azione: Rivolgersi al gestore dell'identità digitale.
    esito: RIFIUTATO
    ritentabile: false
  SPID-008:
    famiglia: SPID
    status: 403
    titolo: Nessun utente attivo per questo codice fiscale
    descrizione: Nessun ente attivo ha un utente attivo con questo codice fiscale.
    azione: Chiedere l'abilitazione all'amministratore dell'ente.
    esito: RIFIUTATO
    ritentabile: false
  SPID-009:
    famiglia: SPID
    status: 403
    titolo: Livello di autenticazione insufficiente
    descrizione: Il livello SPID usato è inferiore a quello richiesto.
    azione: Accedere con il livello richiesto (almeno SPID L2).
    esito: RIFIUTATO
    ritentabile: false
  SPID-010:
    famiglia: SPID
    status: 400
    titolo: Indirizzo di ritorno non ammesso
    descrizione: L'indirizzo di ritorno indicato non è fra quelli ammessi.
    azione: Avviare l'accesso dal portale.
    esito: NON_VALIDO
    ritentabile: false
  SPID-011:
    famiglia: SPID
    status: 400
    titolo: Provider non ammesso
    descrizione: Il provider indicato non è ammesso (valori spid, cie).
    azione: Indicare spid o cie.
    esito: NON_VALIDO
    ritentabile: false
  SPID-012:
    famiglia: SPID
    status: 400
    titolo: Codice di accesso non valido
    descrizione: Il codice di accesso non è valido, è già stato usato o è scaduto.
    azione: Ripetere l'accesso.
    esito: NON_VALIDO
    ritentabile: false

  # ── PDND ───────────────────────────────────────────────────────────
  PDND-401:
    famiglia: PDND
    status: 401
    titolo: Voucher PDND non valido
    descrizione: Il voucher manca, non è valido o non indica il client.
    azione: Richiedere un nuovo voucher a PDND e reinviare.
    esito: NON_VALIDO
    ritentabile: false
    alias: [invalid_token]
  PDND-401-SCADUTO:
    famiglia: PDND
    status: 401
    titolo: Voucher PDND scaduto
    descrizione: Il voucher è scaduto.
    azione: Richiedere un nuovo voucher a PDND e reinviare.
    esito: NON_VALIDO
    ritentabile: false
    alias: [token_expired]
  PDND-403:
    famiglia: PDND
    status: 403
    titolo: Fruitore non registrato
    descrizione: Il client PDND non è associato a un cliente del servizio.
    azione: Chiedere al conservatore l'associazione del client al cliente.
    esito: RIFIUTATO
    ritentabile: false
    alias: [fruitore_non_registrato]
  PDND-403-CLIENTE:
    famiglia: PDND
    status: 403
    titolo: Cliente non attivo
    descrizione: Il cliente associato al fruitore non è attivo.
    azione: Rivolgersi al conservatore.
    esito: RIFIUTATO
    ritentabile: false
    alias: [cliente_non_attivo]
  PDND-404:
    famiglia: PDND
    status: 404
    titolo: Pacchetto non trovato
    descrizione: Il pacchetto richiesto non esiste o non appartiene al cliente del fruitore.
    azione: Verificare l'identificativo.
    esito: NON_VALIDO
    ritentabile: false
    alias: [aip_not_found]
  PDND-422:
    famiglia: PDND
    status: 422
    titolo: Contenuto del file non valido
    descrizione: Il file inviato non è codificato correttamente in base64.
    azione: Codificare il file in base64 standard e reinviare.
    esito: NON_VALIDO
    ritentabile: false
    alias: [file_b64_non_valido]
  PDND-RIFIUTO:
    famiglia: PDND
    status: 422
    titolo: "Dismesso: vedi i codici del versamento (VRS, RGL, VAL)"
    descrizione: Il versamento inoltrato tramite PDND è stato rifiutato dal servizio di versamento. Da R03 l'e-service PDND usa il caso d'uso unico del versamento e risponde con lo stesso codice del REST (es. VRS-130, VRS-121).
    azione: Gestire i codici del versamento; il vecchio `versamento_rifiutato` non è più emesso.
    esito: NON_VALIDO
    ritentabile: false
    alias: [versamento_rifiutato]
    dismesso: true
    sostituito_da: [VRS-130]
  PDND-502:
    famiglia: PDND
    status: 502
    titolo: "Dismesso: vedi VRS-500 e VRS-501"
    descrizione: Il servizio di versamento non è raggiungibile o ha risposto con un errore. Da R03 l'e-service PDND non chiama più il gateway via HTTP; i guasti di storage e database sono VRS-500 e VRS-501 (503).
    azione: Gestire VRS-500 e VRS-501 (ritentabili).
    esito: ERRORE
    ritentabile: true
    alias: [versamento_failed]
    dismesso: true
    sostituito_da: [VRS-500, VRS-501]
  PDND-503:
    famiglia: PDND
    status: 503
    titolo: PDND non configurato
    descrizione: Gli e-service PDND non sono disponibili per configurazione incompleta.
    azione: Segnalare al conservatore.
    esito: ERRORE
    ritentabile: false
    alias: [pdnd_not_configured]
  PDND-503-OCCUPATO:
    famiglia: PDND
    status: 503
    titolo: Troppi versamenti PDND contemporanei
    descrizione: La replica del servizio sta già elaborando il numero massimo di versamenti PDND contemporanei (impostazione PDND_RICHIESTE_CONTEMPORANEE_MAX), oppure lo spazio temporaneo su disco della replica (DISCO_TEMPORANEO_BUDGET_MB, condiviso con i versamenti multipart) è già prenotato da altre richieste in corso (R03 f3). Il file in base64 non è stato letto (R03 f1).
    azione: Ripetere la stessa richiesta (con la stessa Idempotency-Key) dopo i secondi indicati in Retry-After.
    esito: ERRORE
    ritentabile: true
    retry_after: 5
  PDND-413:
    famiglia: PDND
    status: 413
    titolo: File oltre il limite del canale PDND
    descrizione: Il file in base64 supera la dimensione massima ammessa dall'e-service di versamento.
    azione: Ridurre il file; per file grandi usare le API REST con le sessioni di caricamento.
    esito: NON_VALIDO
    ritentabile: false

  # ── RATE ───────────────────────────────────────────────────────────
  RATE-001:
    famiglia: RATE
    status: 429
    titolo: "Dismesso: vedi QTA-001"
    descrizione: Il cliente ha superato il numero di richieste ammesso nella finestra.
    azione: Attendere i secondi indicati in Retry-After e riprovare.
    esito: ERRORE
    ritentabile: true
    retry_after: 60
    dismesso: true
    sostituito_da: [QTA-001]

  # ── QTA: quote per piano (agente R03 b4, VD-C-099) ─────────────────
  QTA-001:
    famiglia: QTA
    status: 429
    titolo: Limite di richieste al minuto superato
    descrizione: L'ente ha superato il numero di richieste al minuto previsto dal suo piano (vale per token, chiavi API e canali).
    azione: Attendere i secondi indicati in Retry-After e riprovare; per limiti più alti rivolgersi al conservatore.
    esito: ERRORE
    ritentabile: true
    retry_after: 60
  QTA-002:
    famiglia: QTA
    status: 429
    titolo: Limite giornaliero di versamenti superato
    descrizione: L'ente ha raggiunto il numero di pacchetti di versamento al giorno previsto dal suo piano.
    azione: Riprovare dal giorno successivo (Retry-After indica i secondi alla mezzanotte, ora italiana) o chiedere al conservatore un piano adeguato.
    esito: ERRORE
    ritentabile: true
    retry_after: 3600

  # ── LC: ciclo di vita ──────────────────────────────────────────────
  LC-501:
    famiglia: LC
    status: 501
    titolo: "Dismesso: vedi LC-410 (migrazione non disponibile dal gateway)"
    descrizione: L'esportazione verso un nuovo conservatore non era realizzata; dal R05 è il riversamento in uscita del servizio ciclo-vita.
    azione: Usare POST /api/v1/ciclo-vita/pratiche/riversamento-uscita.
    esito: RIFIUTATO
    ritentabile: false
    dismesso: true
    sostituito_da: [LC-410]
  LC-503:
    famiglia: LC
    status: 503
    titolo: "Dismesso: vedi LC-410 (ciclo di vita non disponibile dal gateway)"
    descrizione: Lo scenario richiedeva un flusso autorizzato non realizzato; dal R05 le pratiche sono nel servizio ciclo-vita.
    azione: Usare le pratiche di /api/v1/ciclo-vita.
    esito: RIFIUTATO
    ritentabile: false
    dismesso: true
    sostituito_da: [LC-410]
  LC-400-CURSORE:
    famiglia: LC
    status: 400
    titolo: Cursore non valido
    descrizione: Il cursore non appartiene a questo elenco o è illeggibile.
    azione: Ripartire dalla prima pagina senza cursore.
    esito: NON_VALIDO
    ritentabile: false
  LC-403-RUOLO:
    famiglia: LC
    status: 403
    titolo: Ruolo non abilitato all'operazione sulla pratica
    descrizione: Il ruolo non può avviare la pratica, chiedere la transizione o caricare l'allegato (matrice dei permessi del ciclo di vita).
    azione: Chiedere l'operazione a un utente con il ruolo indicato nel messaggio.
    esito: RIFIUTATO
    ritentabile: false
  LC-404:
    famiglia: LC
    status: 404
    titolo: Pratica non trovata
    descrizione: La pratica non esiste o non appartiene all'ente.
    azione: Verificare l'identificativo.
    esito: NON_VALIDO
    ritentabile: false
  LC-404-ENTE:
    famiglia: LC
    status: 404
    titolo: Ente non trovato
    descrizione: L'ente indicato non esiste o non è nel perimetro dell'utente.
    azione: Verificare l'identificativo dell'ente.
    esito: NON_VALIDO
    ritentabile: false
  LC-404-PDV:
    famiglia: LC
    status: 404
    titolo: Versamento non trovato
    descrizione: Il PdV o il PdA non esiste o non appartiene all'ente.
    azione: Verificare l'identificativo.
    esito: NON_VALIDO
    ritentabile: false
  LC-404-ALLEGATO:
    famiglia: LC
    status: 404
    titolo: Allegato non trovato
    descrizione: L'allegato citato non appartiene alla pratica.
    azione: Caricare l'allegato nella pratica e citarne l'identificativo.
    esito: NON_VALIDO
    ritentabile: false
  LC-409-STATO-CAMBIATO:
    famiglia: LC
    status: 409
    titolo: Stato della pratica cambiato
    descrizione: Lo stato della pratica non è quello atteso dal client (STATO_CAMBIATO); un'altra richiesta l'ha modificata. Lo stato attuale è in `dettagli`.
    azione: Rileggere la pratica e ripetere la richiesta con lo stato attuale.
    esito: RIFIUTATO
    ritentabile: false
  LC-409-PIANO-CAMBIATO:
    famiglia: LC
    status: 409
    titolo: Piano cambiato dall'anteprima
    descrizione: Il piano ricalcolato al momento di applicare ha un'impronta diversa da quella dell'anteprima (PIANO_CAMBIATO); nulla è stato scritto. Il piano nuovo è in `dettagli.piano`.
    azione: Rivedere il piano nuovo e confermare con la sua impronta.
    esito: RIFIUTATO
    ritentabile: false
  LC-409-TRANSIZIONE:
    famiglia: LC
    status: 409
    titolo: Transizione non ammessa
    descrizione: La transizione richiesta non è prevista dalla macchina a stati della pratica in questo stato (o per questo tipo di ente).
    azione: Scegliere una delle transizioni indicate in `azioni_consentite` della pratica.
    esito: RIFIUTATO
    ritentabile: false
  LC-409-IN-ESECUZIONE:
    famiglia: LC
    status: 409
    titolo: Esecuzione già richiesta
    descrizione: "L'esecuzione della pratica è già stata chiesta ed è in corso. Finché il servizio non l'ha avviata si può solo respingere; una volta avviata (dettagli.esecuzione_avviata) nessuna transizione è più ammessa: il servizio la porta a termine con il verbale e gli esiti per elemento."
    azione: Seguire lo stato della pratica.
    esito: RIFIUTATO
    ritentabile: false
  LC-409-ANNULLATO:
    famiglia: LC
    status: 409
    titolo: Versamento già annullato
    descrizione: Il versamento ha già una pratica di annullamento.
    azione: "Nessuna azione: l'annullamento è registrato."
    esito: RIFIUTATO
    ritentabile: false
  LC-409-ANNULLAMENTO:
    famiglia: LC
    status: 409
    titolo: Annullamento non ammesso
    descrizione: La configurazione del servizio non ammette l'annullamento dopo la conservazione.
    azione: Concordare con il conservatore una rettifica o uno scarto.
    esito: RIFIUTATO
    ritentabile: false
  LC-409-PDV-STATO:
    famiglia: LC
    status: 409
    titolo: Stato del versamento incompatibile
    descrizione: Il versamento è in lavorazione o in uno stato che non ammette l'operazione (la rettifica richiede un PdV CONSERVATO).
    azione: Attendere la fine della lavorazione o scegliere un altro versamento.
    esito: RIFIUTATO
    ritentabile: false
  LC-409-PRATICA-APERTA:
    famiglia: LC
    status: 409
    titolo: Pratica già aperta
    descrizione: Esiste già una pratica dello stesso tipo non conclusa per lo stesso versamento.
    azione: Seguire la pratica esistente.
    esito: RIFIUTATO
    ritentabile: false
  LC-409-IDEMPOTENZA:
    famiglia: LC
    status: 409
    titolo: Idempotency-Key già usata con un'altra richiesta
    descrizione: La stessa chiave d'idempotenza è stata usata per una richiesta diversa.
    azione: Usare una chiave nuova per una richiesta nuova.
    esito: RIFIUTATO
    ritentabile: false
  LC-410:
    famiglia: LC
    status: 410
    titolo: Operazione spostata nel servizio del ciclo di vita
    descrizione: "L'avvio degli scenari del ciclo di vita dal gateway è dismesso: le pratiche si gestiscono con /api/v1/ciclo-vita/pratiche. Nessuna modifica è stata eseguita."
    azione: Usare l'endpoint indicato in `dettagli.sostituto` (intestazione Link).
    esito: RIFIUTATO
    ritentabile: false
  LC-413-ALLEGATO:
    famiglia: LC
    status: 413
    titolo: Allegato troppo grande
    descrizione: L'allegato supera la dimensione massima ammessa (ALLEGATI_MAX_MB).
    azione: Ridurre il documento o concordare il limite con il conservatore.
    esito: NON_VALIDO
    ritentabile: false
  LC-422-ALLEGATI:
    famiglia: LC
    status: 422
    titolo: Allegati obbligatori mancanti
    descrizione: La transizione richiede allegati caricati nella pratica e citati nella richiesta.
    azione: Caricare gli allegati indicati e citarli nella transizione.
    esito: NON_VALIDO
    ritentabile: false
  LC-422-MOTIVO:
    famiglia: LC
    status: 422
    titolo: Motivo insufficiente
    descrizione: "R09: la chiusura con eccezioni di uno scarto chiede un motivo di almeno 20 caratteri: resta nell'audit e nel registro delle impronte."
    azione: Spiegare perché i pacchetti rimasti non si cancelleranno (es. blocco legale definitivo).
    esito: NON_VALIDO
    ritentabile: false
  LC-403-QUATTRO-OCCHI:
    famiglia: LC
    status: 403
    titolo: Approvazione non ammessa
    descrizione: "R09 (D23): l'annullamento lo approva una persona diversa da chi l'ha chiesto, dell'ente, con un ruolo ammesso dall'ente (ANNULLAMENTO_RUOLI_APPROVAZIONE) e con un accesso personale (non con chiave API)."
    azione: Chiedere l'approvazione a un'altra persona autorizzata dell'ente.
    esito: RIFIUTATO
    ritentabile: false
  LC-409-APPROVAZIONE:
    famiglia: LC
    status: 409
    titolo: Nessuna approvazione in attesa
    descrizione: "R09 (D23): la pratica non è un annullamento in attesa della seconda approvazione (già approvata, respinta o eseguita)."
    azione: Ricaricare la pratica e controllarne lo stato.
    esito: RIFIUTATO
    ritentabile: false
  LC-422-ALLEGATO-TIPO:
    famiglia: LC
    status: 422
    titolo: Allegato non ammesso
    descrizione: Tipo di allegato non caricabile dagli utenti, oppure file vuoto.
    azione: Usare AUTORIZZAZIONE_PRODUTTORE, NULLA_OSTA o ALTRO con un file non vuoto.
    esito: NON_VALIDO
    ritentabile: false
  LC-422-FIRMA:
    famiglia: LC
    status: 422
    titolo: Firma del documento non accettabile
    descrizione: "Il documento deve essere firmato (CAdES .p7m o PDF con firma PAdES) e, da R08, la firma è VERIFICATA al livello dell'ente (CICLO_VITA_FIRME_LIVELLO): firma alterata, certificato revocato, catena non riconducibile a un prestatore fidato o stato di revoca non disponibile (livello CON_REVOCHE) la rendono non accettabile. Il motivo in parole è in `dettaglio`, l'esito normalizzato in `dettagli.firma`."
    azione: Caricare il documento firmato digitalmente con un certificato valido e non revocato.
    esito: NON_VALIDO
    ritentabile: false
  LC-422-CRITERI:
    famiglia: LC
    status: 422
    titolo: Criteri della pratica non validi
    descrizione: Criteri incoerenti (indicare anni oppure scadenza_entro), classe non disponibile, nessun PdA selezionabile o troppi PdA per una pratica.
    azione: Correggere o restringere i criteri.
    esito: NON_VALIDO
    ritentabile: false
  LC-422-METADATI:
    famiglia: LC
    status: 422
    titolo: Metadati della rettifica non validi
    descrizione: Metadati vuoti, con nomi non ammessi o valori di tipo non previsto, oppure identificativo del pacchetto assente.
    azione: Indicare aip_id o pdv_id e metadati con nomi in minuscolo e valori semplici.
    esito: NON_VALIDO
    ritentabile: false
  LC-422-CARICAMENTO:
    famiglia: LC
    status: 422
    titolo: Sessione di caricamento non utilizzabile
    descrizione: La sessione di caricamento del PdD ricevuto non esiste per l'ente, non è COMPLETA, è già stata usata o supera la dimensione ammessa.
    azione: Caricare di nuovo il PdD con una sessione di caricamento e usare il suo identificativo.
    esito: NON_VALIDO
    ritentabile: false
  LC-503-DB:
    famiglia: LC
    status: 503
    titolo: Ciclo di vita temporaneamente non disponibile
    descrizione: Il database non ha risposto.
    azione: Riprovare tra poco.
    esito: ERRORE
    ritentabile: true
    retry_after: 30
  LC-422-RICHIESTA-FIRMATA:
    famiglia: LC
    status: 422
    titolo: Richiesta di annullamento firmata mancante o non pertinente
    descrizione: "L'ente richiede la richiesta di annullamento firmata (ANNULLAMENTO_RICHIESTA_FIRMATA = OBBLIGATORIA) o il documento firmato non riporta l'identificativo del versamento (R08, D22)."
    azione: Allegare in `documento_firmato` la richiesta firmata che cita l'identificativo del versamento.
    esito: NON_VALIDO
    ritentabile: false
  LC-503-FIRME:
    famiglia: LC
    status: 503
    titolo: Verifica delle firme non disponibile
    descrizione: Il verificatore delle firme (servizio verifica-firme o ripiego) non ha risposto; nulla è stato registrato.
    azione: Riprovare tra poco.
    esito: ERRORE
    ritentabile: true
    retry_after: 60
  LC-503-STORAGE:
    famiglia: LC
    status: 503
    titolo: Storage conservativo non disponibile
    descrizione: La scrittura nel WORM non è riuscita; nulla è stato registrato.
    azione: Riprovare tra poco.
    esito: ERRORE
    ritentabile: true
    retry_after: 60
  LC-422-IMPRONTA:
    famiglia: LC
    status: 422
    titolo: Impronta del file ricevuto cambiata
    descrizione: Durante l'invio al gateway l'impronta di un file del PdD ricevuto non corrisponde a quella verificata.
    azione: Verificare il PdD ricevuto e ripetere il riversamento.
    esito: NON_VALIDO
    ritentabile: false
    contesto: asincrono
  LC-500-LAVORATORE:
    famiglia: LC
    status: 500
    titolo: Errore interno del lavoratore del ciclo di vita
    descrizione: Il passo della pratica è terminato con un'eccezione non prevista; la pratica sarà ripresa.
    azione: Segnalare al conservatore se l'errore persiste.
    esito: ERRORE
    ritentabile: true
    contesto: asincrono
  LC-403-CONFERMA:
    famiglia: LC
    status: 403
    titolo: "Conferma firmata della decisione richiesta"
    descrizione: "Questa decisione (approvazione o esecuzione di uno scarto, esecuzione di un riversamento in uscita, richiesta o approvazione di un annullamento, rettifica, ripresa di una pratica sospesa) richiede la conferma firmata dal gateway dopo una conferma dell'identità recente; manca, è scaduta, è già stata usata o non corrisponde alla pratica, alla versione o al contenuto deciso. Con una chiave API non si può ottenere."
    azione: "Ripetere la decisione dalla console confermando la propria identità quando richiesto."
    esito: RIFIUTATO
    ritentabile: false
  LC-503-CONFERMA:
    famiglia: LC
    status: 503
    titolo: "Verifica delle conferme non disponibile"
    descrizione: "Le chiavi pubbliche del gateway per verificare le conferme delle decisioni non sono configurate: nessuna decisione sensibile si registra (fail-closed)."
    azione: "Segnalare all'operatore dell'infrastruttura: CONFERME_CHIAVI_PUBBLICHE nella configurazione di ciclo-vita (runbook conferme_decisione)."
    esito: ERRORE
    ritentabile: true
    retry_after: 60
  LC-409-AUTORIZZAZIONI:
    famiglia: LC
    status: 409
    titolo: Autorizzazioni dello scarto non verificate
    descrizione: "Prima di cancellare, il lavoratore ha ricontrollato da sé la catena delle autorizzazioni della pratica di scarto (cronologia completa e continua, nulla osta della Soprintendenza per le pubbliche amministrazioni, autorizzazione del produttore e nulla osta presenti nello storage conservativo con l'impronta registrata, piano approvato) e qualcosa non torna (elenco in `ultimo_errore.difetti`). Nessun documento è stato cancellato e la pratica non ha più lavoro."
    azione: "Segnalare al conservatore: anomalia di sicurezza da verificare (runbook scarto_incompleto, § autorizzazioni non verificate). La pratica si può respingere."
    esito: RIFIUTATO
    ritentabile: false
    contesto: asincrono
  LC-409-TENTATIVI-ESAURITI:
    famiglia: LC
    status: 409
    titolo: Lavoro della pratica sospeso dopo troppi tentativi
    descrizione: "Il lavoratore ha fallito il passo della pratica per `LAVORATORE_TENTATIVI_MASSIMI` volte di seguito (registro, gateway, distribution o storage che rifiutano sempre, oppure un difetto): il lavoro è stato tolto e la pratica è ferma in uno stato di errore esplicito, con l'ultimo errore in `ultimo_errore.ultimo` e il lavoro sospeso in `ultimo_errore.lavoro_sospeso`. Nessun nuovo tentativo automatico; ciò che era già stato fatto resta registrato."
    azione: "Segnalare al conservatore: corretta la causa, la pratica si riprende con la procedura del runbook pratica_sospesa (allarme PraticaSospesa). Se l'esecuzione non era ancora iniziata, la pratica si può anche respingere."
    esito: ERRORE
    ritentabile: false
    contesto: asincrono
  LC-409-NON-SOSPESA:
    famiglia: LC
    status: 409
    titolo: Pratica non sospesa
    descrizione: "Si è chiesto di riprendere una pratica che non è sospesa dopo i tentativi esauriti (`LC-409-TENTATIVI-ESAURITI`): ha ancora il suo lavoro, oppure non ne ha mai avuto uno sospeso."
    azione: Ricaricare la pratica e controllarne lo stato.
    esito: RIFIUTATO
    ritentabile: false
  LC-503-REGISTRO:
    famiglia: LC
    status: 503
    titolo: Registro delle impronte non disponibile
    descrizione: La foglia del ciclo di vita non è stata accettata dal registro (servizio irraggiungibile o non configurato); il passo sarà ripetuto.
    azione: "Nessuna azione: la pratica riprende da sola."
    esito: ERRORE
    ritentabile: true
    contesto: asincrono
  LC-503-GATEWAY:
    famiglia: LC
    status: 503
    titolo: Gateway non disponibile per il versamento
    descrizione: Il versamento della rettifica o del riversamento non è riuscito per un errore temporaneo o di configurazione; il passo sarà ripetuto.
    azione: "Nessuna azione: la pratica riprende da sola."
    esito: ERRORE
    ritentabile: true
    contesto: asincrono
  LC-503-DISTRIBUTION:
    famiglia: LC
    status: 503
    titolo: Distribution non disponibile per i pacchetti di migrazione
    descrizione: La richiesta dei PdD MIGRAZIONE non è riuscita per un errore temporaneo o di configurazione; il passo sarà ripetuto.
    azione: "Nessuna azione: la pratica riprende da sola."
    esito: ERRORE
    ritentabile: true
    contesto: asincrono
  LC-503-LAVORATORE:
    famiglia: LC
    status: 503
    titolo: Passo della pratica rinviato
    descrizione: Un sistema esterno o lo storage non ha risposto; il passo sarà ripetuto dopo l'attesa prevista.
    azione: "Nessuna azione: la pratica riprende da sola."
    esito: ERRORE
    ritentabile: true
    contesto: asincrono

  # ── HC: catena delle impronte ──────────────────────────────────────
  HC-403:
    famiglia: HC
    status: 403
    titolo: Ruolo non autorizzato alla verifica della catena
    descrizione: La verifica completa della catena è riservata ai ruoli del conservatore.
    azione: Chiedere la verifica a un responsabile del conservatore.
    esito: RIFIUTATO
    ritentabile: false
  HC-404:
    famiglia: HC
    status: 404
    titolo: Verifica non trovata
    descrizione: La verifica della catena indicata non esiste.
    azione: Verificare l'identificativo.
    esito: NON_VALIDO
    ritentabile: false
  HC-409:
    famiglia: HC
    status: 409
    titolo: Verifica già in corso
    descrizione: Una verifica completa della catena è già in esecuzione.
    azione: Attendere la fine della verifica in corso.
    esito: ERRORE
    ritentabile: true
  HC-503:
    famiglia: HC
    status: 503
    titolo: Catena temporaneamente non disponibile
    descrizione: Il database della catena non ha risposto.
    azione: Riprovare tra poco.
    esito: ERRORE
    ritentabile: true
    retry_after: 30

  # ── CAT: registro delle impronte a due livelli (R04) ──────────────
  CAT-400-CURSORE:
    famiglia: CAT
    status: 400
    titolo: Cursore non valido
    descrizione: Il cursore indicato non è stato prodotto da questo elenco del registro (allarmi).
    azione: Ripartire dalla prima pagina, senza cursore.
    esito: NON_VALIDO
    ritentabile: false
  CAT-403:
    famiglia: CAT
    status: 403
    titolo: Lettura del registro non autorizzata
    descrizione: Le foglie del registro sono riservate ai ruoli del conservatore e ai token di servizio con lo scope di lettura del registro (testimone, verificatori).
    azione: Usare un'utenza del conservatore o il token di servizio previsto.
    esito: RIFIUTATO
    ritentabile: false
  CAT-404:
    famiglia: CAT
    status: 404
    titolo: Elemento del registro non trovato
    descrizione: Il checkpoint, il PdA o il documento indicati non esistono (o il PdA appartiene a un altro ente).
    azione: Verificare URN del PdA, identificativo del documento e dimensione del checkpoint.
    esito: NON_VALIDO
    ritentabile: false
  CAT-409:
    famiglia: CAT
    status: 409
    titolo: PdA non ancora coperto da un checkpoint
    descrizione: Il PdA non è ancora nel registro oppure è stato aggiunto dopo il checkpoint richiesto.
    azione: Riprovare dopo il prossimo checkpoint (cadenza CATENA_CHECKPOINT_SECONDI) o chiedere la prova rispetto all'ultimo checkpoint.
    esito: ERRORE
    ritentabile: true
    retry_after: 60
  CAT-409-RISCONTRO:
    famiglia: CAT
    status: 409
    titolo: Foglia del ciclo di vita senza riscontro
    descrizione: "Il registro aggiunge una foglia di scarto, annullamento o rettifica solo se il fatto risulta dal database: pratica del tipo indicato, dello stesso ente del PdA, nello stato in cui la foglia si chiede, e PdA (o PdV) nello stato atteso (scarto: oggetto ELIMINATO e PdA in ELIMINAZIONE; annullamento: PdV ANNULLATO), con il fatto di esecuzione scritto dal lavoratore di ciclo-vita (scarto: PdA eliminato; annullamento: atto archiviato con l'impronta della foglia; rettifica: PdV di rettifica versato, R06)."
    azione: Verificare la pratica indicata in riferimento.pratica e lo stato del PdA; il servizio ciclo-vita chiede la foglia solo dopo aver registrato il fatto.
    esito: RIFIUTATO
    ritentabile: false
  CAT-422:
    famiglia: CAT
    status: 422
    titolo: Dimensioni del registro non valide
    descrizione: La prova di consistenza richiede 0 ≤ da ≤ a ≤ dimensione dell'ultimo checkpoint.
    azione: Indicare dimensioni di checkpoint emessi.
    esito: NON_VALIDO
    ritentabile: false
  CAT-503:
    famiglia: CAT
    status: 503
    titolo: Registro temporaneamente non disponibile
    descrizione: Il database del registro non ha risposto.
    azione: Riprovare tra poco.
    esito: ERRORE
    ritentabile: true
    retry_after: 30
  CAT-WORM-DIVERSO:
    famiglia: CAT
    status: 500
    titolo: Oggetto del registro diverso nello storage conservativo
    descrizione: Un oggetto del registro delle impronte (checkpoint, segmento di foglie, albero del PdA o RdV) è già presente nello storage conservativo con un contenuto diverso; nulla è stato sovrascritto ed è stato registrato un allarme di integrità.
    azione: Nessuna per il cliente; il conservatore indaga l'allarme di integrità.
    esito: ERRORE
    ritentabile: false

  # ── DST: distribuzione ─────────────────────────────────────────────
  DST-101:
    famiglia: DST
    status: 422
    titolo: Pacchetto non distribuibile
    descrizione: Lo stato del pacchetto non ne consente la distribuzione.
    azione: Attendere che il pacchetto sia conservato.
    esito: RIFIUTATO
    ritentabile: false
  DST-102:
    famiglia: DST
    status: 400
    titolo: File richiesti mancanti
    descrizione: Una distribuzione di tipo ESTRATTO richiede l'elenco dei file.
    azione: Indicare `file_richiesti` e reinviare.
    esito: NON_VALIDO
    ritentabile: false
  DST-403:
    famiglia: DST
    status: 403
    titolo: Richiesta non attribuibile
    descrizione: Il token non indica l'utente che richiede la distribuzione.
    azione: Usare un token emesso per un utente.
    esito: RIFIUTATO
    ritentabile: false
  DST-404:
    famiglia: DST
    status: 404
    titolo: Pacchetto non trovato
    descrizione: Il pacchetto o la richiesta non esistono o non appartengono al cliente.
    azione: Verificare l'identificativo.
    esito: NON_VALIDO
    ritentabile: false
  DST-422:
    famiglia: DST
    status: 422
    titolo: Richiesta di distribuzione non valida
    descrizione: Un identificativo o un campo della richiesta non è valido.
    azione: Correggere il campo indicato e reinviare.
    esito: NON_VALIDO
    ritentabile: false
  DST-503:
    famiglia: DST
    status: 503
    titolo: Distribuzione temporaneamente non disponibile
    descrizione: Il registro o l'indice di ricerca non hanno risposto.
    azione: Riprovare tra poco.
    esito: ERRORE
    ritentabile: true
    retry_after: 30
  DST-ENTE:
    famiglia: DST
    status: 403
    titolo: Ente non valido
    descrizione: Il token non indica un ente valido oppure `tenant_id` non è valido.
    azione: Indicare un ente valido.
    esito: NON_VALIDO
    ritentabile: false
  # Agente R03 b4 (VD-C-077, VD-C-093): PdD completi e ricerca a cursore.
  DST-103:
    famiglia: DST
    status: 422
    titolo: File richiesti non presenti nel pacchetto
    descrizione: Uno o più nomi di `file_richiesti` non corrispondono a documenti del pacchetto di archiviazione.
    azione: Indicare i nomi dei file come compaiono nel pacchetto (elenco in `dettagli.disponibili`).
    esito: NON_VALIDO
    ritentabile: false
  DST-104:
    famiglia: DST
    status: 422
    titolo: Cursore di ricerca non valido
    descrizione: Il cursore indicato non è stato emesso da questa ricerca o è stato alterato.
    azione: Ripartire dalla prima pagina senza cursore e usare il `cursore` restituito.
    esito: NON_VALIDO
    ritentabile: false
  DST-410:
    famiglia: DST
    status: 410
    titolo: Pacchetto di distribuzione scaduto
    descrizione: I collegamenti del pacchetto di distribuzione sono scaduti o il pacchetto è stato rimosso dallo storage temporaneo.
    azione: Richiedere un nuovo pacchetto di distribuzione.
    esito: RIFIUTATO
    ritentabile: false
  DST-409:
    famiglia: DST
    status: 409
    titolo: Pacchetto di distribuzione non rigenerabile
    descrizione: "R07 (D18): si rigenera solo un pacchetto scaduto (stato SCADUTO o PRONTO oltre la scadenza); lo stato attuale è in `dettagli.stato`."
    azione: Scaricare il pacchetto ancora valido o attendere che sia pronto.
    esito: RIFIUTATO
    ritentabile: false
  DST-502:
    famiglia: DST
    status: 502
    titolo: Impronta di un file del pacchetto non corrispondente
    descrizione: Un file letto dallo storage non corrisponde all'impronta registrata alla conservazione; il pacchetto non è stato consegnato e l'anomalia è registrata.
    azione: Segnalare al conservatore indicando l'identificativo della richiesta.
    esito: ERRORE
    ritentabile: false

  # ── FSC: fascicoli ─────────────────────────────────────────────────
  FSC-401:
    famiglia: FSC
    status: 401
    titolo: Autenticazione richiesta
