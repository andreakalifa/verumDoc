    ritentabile: true
  FIRMA-502-FIRMA-NON-VALIDA:
    famiglia: FIRMA
    status: 502
    titolo: Firma prodotta non valida
    descrizione: La firma o la marca restituita dal fornitore non supera la verifica crittografica (impronta, firma, catena o certificato atteso) e non si usa.
    azione: Ritentare; se persiste, controllare il fornitore e le radici configurate in console.
    esito: ERRORE
    ritentabile: true
  FIRMA-404-FORNITORE:
    famiglia: FIRMA
    status: 404
    titolo: Fornitore di firma non registrato
    descrizione: Nessun fornitore di firma o marca con il codice indicato.
    azione: Controllare il codice nella pagina «Fornitori di firma e marca».
    esito: NON_VALIDO
    ritentabile: false
  FIRMA-403-FORNITORI:
    famiglia: FIRMA
    status: 403
    titolo: Operazione riservata al conservatore
    descrizione: Registrare, modificare e provare i fornitori di firma e marca è un permesso mai delegabile dei ruoli del conservatore.
    azione: Chiedere a un responsabile del conservatore.
    esito: RIFIUTATO
    ritentabile: false
  FIRMA-422-CONFIGURAZIONE:
    famiglia: FIRMA
    status: 422
    titolo: Configurazione del fornitore non valida
    descrizione: La configurazione del fornitore di firma o marca non è utilizzabile (campi mancanti, indirizzi, radici, segreti nella console, fornitore di sviluppo in produzione).
    azione: Correggere i campi indicati nei motivi.
    esito: NON_VALIDO
    ritentabile: false
  FIRMA-429-PROVA:
    famiglia: FIRMA
    status: 429
    titolo: Troppe prove di connessione
    descrizione: Le prove con firma di prova consumano firme del prestatore e sono limitate.
    azione: Riprovare fra qualche minuto.
    esito: ERRORE
    ritentabile: true
  FIRMA-503-NON-CONFIGURATA:
    famiglia: FIRMA
    status: 503
    titolo: Firma non configurata
    descrizione: Nessun fornitore è configurato per l'operazione richiesta.
    azione: Segnalare al conservatore.
    esito: ERRORE
    ritentabile: false
  FIRMA-409-SVILUPPO-IN-PRODUZIONE:
    famiglia: FIRMA
    status: 409
    titolo: Adattatore di sviluppo vietato in produzione
    descrizione: L'adattatore di sviluppo non può firmare né marcare in produzione.
    azione: Configurare un fornitore qualificato.
    esito: RIFIUTATO
    ritentabile: false
  FIRMA-502-FORNITORE:
    famiglia: FIRMA
    status: 502
    titolo: Errore del fornitore di firma o marca
    descrizione: Il fornitore remoto ha risposto con un errore o una risposta non valida.
    azione: Riprovare più tardi.
    esito: ERRORE
    ritentabile: true
  FIRMA-503-LIMITE:
    famiglia: FIRMA
    status: 503
    titolo: Limite di frequenza non verificabile
    descrizione: Il contatore condiviso fra le repliche (Redis) non ha risposto; le operazioni che consumano firme del prestatore non partono senza il controllo del limite.
    azione: Riprovare tra poco; se persiste, controllare Redis.
    esito: ERRORE
    ritentabile: true
  FIRMA-403-PERSONALE:
    famiglia: FIRMA
    status: 403
    titolo: Firma personale non consentita
    descrizione: La firma personale con OTP è riservata alle persone del conservatore con una credenziale personale, con un accesso al portale (mai una chiave API o un token di servizio).
    azione: Accedere con la propria utenza del conservatore.
    esito: RIFIUTATO
    ritentabile: false
  FIRMA-404-CREDENZIALE:
    famiglia: FIRMA
    status: 404
    titolo: Nessuna credenziale di firma personale
    descrizione: La persona non ha una credenziale di firma personale attiva, oppure il fornitore indicato non è un fornitore CSC attivo e costruito.
    azione: Chiedere al conservatore di registrare la credenziale personale (Console, Firma qualificata).
    esito: RIFIUTATO
    ritentabile: false
  FIRMA-422-OTP:
    famiglia: FIRMA
    status: 422
    titolo: OTP o PIN non accettato
    descrizione: Il prestatore ha rifiutato il codice monouso (OTP) o il PIN della firma personale.
    azione: Chiedere un nuovo OTP e riprovare.
    esito: NON_VALIDO
    ritentabile: false
  FIRMA-429-PERSONALE:
    famiglia: FIRMA
    status: 429
    titolo: Troppi tentativi di firma personale
    descrizione: Le richieste di OTP e i tentativi di firma personale sono limitati per persona.
    azione: Riprovare fra qualche minuto.
    esito: ERRORE
    ritentabile: true
  FIRMA-422-RICHIESTA:
    famiglia: FIRMA
    status: 422
    titolo: Richiesta di firma non utilizzabile
    descrizione: Il contenuto non è utilizzabile per l'operazione (es. non PDF per PAdES).
    azione: Correggere il contenuto o il tipo di firma.
    esito: NON_VALIDO
    ritentabile: false

  # ── ONB ────────────────────────────────────────────────────────────
  ONB-001:
    famiglia: ONB
    status: 409
    titolo: Cliente già registrato
    descrizione: Un cliente con lo stesso codice fiscale è già presente.
    azione: Usare il cliente esistente.
    esito: RIFIUTATO
    ritentabile: false
  ONB-201:
    famiglia: ONB
    status: 422
    titolo: Transizione di stato non ammessa
    descrizione: Il cambio di stato richiesto non è consentito dallo stato attuale.
    azione: Usare una delle transizioni ammesse indicate nel dettaglio.
    esito: RIFIUTATO
    ritentabile: false
  ONB-202:
    famiglia: ONB
    status: 422
    titolo: Stato non valido
    descrizione: Lo stato indicato non esiste.
    azione: Usare uno dei valori ammessi indicati nel dettaglio.
    esito: NON_VALIDO
    ritentabile: false
  ONB-203:
    famiglia: ONB
    status: 422
    titolo: Filtro di stato non valido
    descrizione: Lo stato usato come filtro non esiste.
    azione: Usare uno dei valori ammessi.
    esito: NON_VALIDO
    ritentabile: false
  ONB-400:
    famiglia: ONB
    status: 400
    titolo: Richiesta non valida
    descrizione: Un parametro o il corpo della richiesta non sono validi.
    azione: Correggere la richiesta.
    esito: NON_VALIDO
    ritentabile: false
  ONB-404:
    famiglia: ONB
    status: 404
    titolo: Risorsa non trovata
    descrizione: Cliente, utente o chiave API non trovati.
    azione: Verificare l'identificativo.
    esito: NON_VALIDO
    ritentabile: false
  ONB-409:
    famiglia: ONB
    status: 409
    titolo: Dato già registrato
    descrizione: Esiste già un utente con la stessa email o lo stesso codice fiscale nell'ente.
    azione: Usare l'utente esistente o correggere il dato.
    esito: RIFIUTATO
    ritentabile: false
  ONB-412:
    famiglia: ONB
    status: 409
    titolo: Preferenze modificate da un'altra sessione
    descrizione: "R07 (D31): la versione delle preferenze indicata non è quella salvata; la versione attuale è in `dettagli.versione`."
    azione: Rileggere le preferenze e ripetere il salvataggio.
    esito: RIFIUTATO
    ritentabile: false
  ONB-422:
    famiglia: ONB
    status: 422
    titolo: Dato non valido
    descrizione: Un campo obbligatorio è vuoto o non è valido.
    azione: Correggere il campo indicato.
    esito: NON_VALIDO
    ritentabile: false
  ONB-503:
    famiglia: ONB
    status: 503
    titolo: Servizio utenti temporaneamente non disponibile
    descrizione: Il database non ha risposto.
    azione: Riprovare tra poco; se persiste segnalare l'identificativo della richiesta.
    esito: ERRORE
    ritentabile: true
    retry_after: 30
  ONB-530:
    famiglia: ONB
    status: 503
    titolo: Generazione delle chiavi API non disponibile
    descrizione: Le chiavi API non si possono generare in questo ambiente (configurazione incompleta).
    azione: Segnalare al conservatore.
    esito: ERRORE
    ritentabile: false

  # ── S3 ─────────────────────────────────────────────────────────────
  S3-500:
    famiglia: S3
    status: 503
    titolo: Storage conservativo non disponibile
    descrizione: Lo storage conservativo non ha accettato la scrittura; nessun oggetto è stato scritto.
    azione: Riprovare più tardi.
    esito: ERRORE
    ritentabile: true
  S3-CONFIG:
    famiglia: S3
    status: 503
    titolo: Configurazione dello storage non valida
    descrizione: La configurazione dello storage conservativo è incompleta o non valida; nessun oggetto è stato scritto.
    azione: Nessuna per il cliente; il conservatore corregge la configurazione.
    esito: ERRORE
    ritentabile: false
  S3-NO-OBJECT-LOCK:
    famiglia: S3
    status: 503
    titolo: Bucket senza Object Lock
    descrizione: Il bucket non ha Object Lock attivo; lo storage non è conservativo e la scrittura è stata bloccata.
    azione: Nessuna per il cliente; il conservatore corregge la configurazione.
    esito: ERRORE
    ritentabile: false
  S3-GIA-PRESENTE:
    famiglia: S3
    status: 409
    titolo: Oggetto già presente
    descrizione: Un oggetto con la stessa chiave è già nello storage conservativo e non si sovrascrive.
    azione: Nessuna per il cliente; il servizio confronta il contenuto esistente.
    esito: ERRORE
    ritentabile: false
  S3-RETENTION:
    famiglia: S3
    status: 500
    titolo: Conservazione non determinabile
    descrizione: Non è stato possibile calcolare la scadenza di conservazione dell'oggetto; nessun oggetto è stato scritto.
    azione: Segnalare al conservatore.
    esito: ERRORE
    ritentabile: false
  S3-ORIGINE-MODIFICATA:
    famiglia: S3
    status: 503
    titolo: File d'origine modificato durante la copia
    descrizione: Il file nello storage di transito è cambiato fra il calcolo delle impronte e la copia nello storage conservativo; la copia non è avvenuta.
    azione: Nessuna per il cliente; il servizio ritenta e ricalcola le impronte.
    esito: ERRORE
    ritentabile: true
  S3-COPIA-DIVERSA:
    famiglia: S3
    status: 500
    titolo: Copia conservativa diversa dall'origine
    descrizione: La copia nello storage conservativo non ha l'impronta o la dimensione del file d'origine.
    azione: Segnalare al conservatore.
    esito: ERRORE
    ritentabile: false

  # ── UPL: file già caricati (sessioni di caricamento) ───────────────
  UPL-404:
    famiglia: UPL
    status: 404
    titolo: File caricato non trovato
    descrizione: Il versamento cita un file caricato che non esiste nello storage di transito o non appartiene al cliente.
    azione: Verificare l'identificativo del caricamento o caricare di nuovo il file.
    esito: NON_VALIDO
    ritentabile: false
  UPL-422:
    famiglia: UPL
    status: 422
    titolo: File caricato incompleto o incoerente
    descrizione: Il file caricato citato dal versamento non ha impronte e testa complete oppure la sua dimensione non corrisponde all'oggetto nello storage.
    azione: Concludere il caricamento oppure caricare di nuovo il file.
    esito: NON_VALIDO
    ritentabile: false
  # ── UPL: sessioni di caricamento (R03 b1, contratto C1) ────────────
  UPL-001:
    famiglia: UPL
    status: 413
    titolo: File oltre la dimensione massima
    descrizione: La dimensione dichiarata all'apertura della sessione supera il limite del servizio di caricamento.
    azione: Ridurre il file o chiedere al conservatore il limite applicabile.
    esito: NON_VALIDO
    ritentabile: false
  UPL-002:
    famiglia: UPL
    status: 422
    titolo: Parte non valida
    descrizione: Il numero della parte è fuori dall'intervallo della sessione oppure la sua dimensione è diversa da quella attesa (dimensione_parte, l'ultima il resto del file).
    azione: Inviare la parte con il numero e la dimensione indicati all'apertura della sessione.
    esito: NON_VALIDO
    ritentabile: false
  UPL-003:
    famiglia: UPL
    status: 422
    titolo: Impronta della parte errata
    descrizione: L'impronta SHA-256 dichiarata in X-Impronta-Parte non corrisponde ai byte ricevuti; la parte non è stata registrata.
    azione: Rileggere la parte dalla sorgente e inviarla di nuovo.
    esito: NON_VALIDO
    ritentabile: false
  UPL-004:
    famiglia: UPL
    status: 409
    titolo: Parte già ricevuta con un contenuto diverso
    descrizione: Una parte con lo stesso numero è già stata ricevuta con byte diversi. Ripetere la stessa parte con lo stesso contenuto è invece ammesso.
    azione: Verificare la sorgente; per ricominciare annullare la sessione e aprirne una nuova.
    esito: NON_VALIDO
    ritentabile: false
  UPL-005:
    famiglia: UPL
    status: 409
    titolo: Parti mancanti
    descrizione: La sessione non può essere completata perché alcune parti non sono state ricevute (elenco in dettagli.parti_mancanti).
    azione: Inviare le parti mancanti e richiedere di nuovo il completamento.
    esito: NON_VALIDO
    ritentabile: false
  UPL-006:
    famiglia: UPL
    status: 422
    titolo: Impronta del file diversa da quella dichiarata
    descrizione: L'impronta calcolata dal servizio sul file assemblato non corrisponde a quella dichiarata all'apertura della sessione. Compare nel campo errore della sessione.
    azione: Verificare il file sorgente e caricarlo in una nuova sessione.
    esito: NON_VALIDO
    ritentabile: false
    contesto: asincrono
  UPL-007:
    famiglia: UPL
    status: 409
    titolo: Idempotency-Key già usata per un'altra sessione
    descrizione: La stessa Idempotency-Key ha già aperto una sessione con nome, dimensione o impronta diversi.
    azione: Usare una nuova chiave per un file diverso.
    esito: NON_VALIDO
    ritentabile: false
  UPL-008:
    famiglia: UPL
    status: 409
    titolo: Caricamento già usato da un altro versamento
    descrizione: Una sessione di caricamento si usa in un solo versamento; questa è già legata a un altro PdV.
    azione: Caricare di nuovo il file in una nuova sessione.
    esito: RIFIUTATO
    ritentabile: false
  UPL-009:
    famiglia: UPL
    status: 409
    titolo: Caricamento non ancora verificato
    descrizione: Il versamento cita una sessione che non è nello stato COMPLETO (stato attuale in dettagli.stato).
    azione: Attendere lo stato COMPLETO (GET della sessione); se lo stato è ERRORE caricare di nuovo il file.
    esito: ERRORE
    ritentabile: true
    retry_after: 5
  UPL-400:
    famiglia: UPL
    status: 400
    titolo: Richiesta di caricamento non valida
    descrizione: Un'intestazione o un campo della sessione di caricamento non è nella forma prevista (es. X-Impronta-Parte, algoritmo d'impronta non ammesso).
    azione: Correggere la richiesta secondo la documentazione delle sessioni di caricamento.
    esito: NON_VALIDO
    ritentabile: false
  UPL-409:
    famiglia: UPL
    status: 409
    titolo: Operazione non ammessa nello stato della sessione
    descrizione: Lo stato attuale della sessione (in dettagli.stato) non ammette l'operazione richiesta.
    azione: Leggere lo stato della sessione e procedere di conseguenza.
    esito: NON_VALIDO
    ritentabile: false
  UPL-410:
    famiglia: UPL
    status: 410
    titolo: Sessione scaduta o annullata
    descrizione: La sessione di caricamento è scaduta o è stata annullata; i file caricati sono eliminati.
    azione: Aprire una nuova sessione e caricare di nuovo il file.
    esito: NON_VALIDO
    ritentabile: false
  UPL-413:
    famiglia: UPL
    status: 413
    titolo: Corpo della richiesta oltre il limite
    descrizione: Il corpo della richiesta supera la dimensione ammessa per questa operazione.
    azione: Ridurre la richiesta; per i file grandi usare le sessioni di caricamento.
    esito: NON_VALIDO
    ritentabile: false
  UPL-502:
    famiglia: UPL
    status: 502
    titolo: Verifica del file non riuscita
    descrizione: Il file non è stato verificato dopo più tentativi per un errore dello storage. Compare nel campo errore della sessione.
    azione: Caricare di nuovo il file in una nuova sessione; se si ripete segnalare l'identificativo della sessione.
    esito: ERRORE
    ritentabile: true
    contesto: asincrono
  UPL-503:
    famiglia: UPL
    status: 503
    titolo: Servizio di caricamento temporaneamente non disponibile
    descrizione: Lo storage o il database non sono raggiungibili in questo momento.
    azione: Ripetere la stessa richiesta più tardi.
    esito: ERRORE
    ritentabile: true
    retry_after: 30
  UPL-503-OCCUPATO:
    famiglia: UPL
    status: 503
    titolo: Troppi versamenti multipart contemporanei
    descrizione: La replica del servizio sta già elaborando il numero massimo di versamenti multipart contemporanei (impostazione VERSAMENTO_MULTIPART_RICHIESTE_CONTEMPORANEE_MAX), oppure lo spazio temporaneo su disco della replica (DISCO_TEMPORANEO_BUDGET_MB, condiviso con PDND) è già prenotato da altre richieste in corso. Il corpo della richiesta non è stato letto (R03 f3).
    azione: Ripetere la stessa richiesta (con la stessa Idempotency-Key) dopo i secondi indicati in Retry-After; per i file grandi usare le sessioni di caricamento.
    esito: ERRORE
    ritentabile: true
    retry_after: 5
