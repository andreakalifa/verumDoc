    esito: NON_VALIDO
    ritentabile: false
  FSC-409:
    famiglia: FSC
    status: 409
    titolo: Operazione in conflitto con lo stato del fascicolo
    descrizione: Codice già usato, fascicolo non aperto o pacchetto già presente.
