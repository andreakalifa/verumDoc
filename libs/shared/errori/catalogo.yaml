    esito: NON_VALIDO
    ritentabile: false
  FSC-400-CURSORE:
    famiglia: FSC
    status: 400
    titolo: Cursore non valido
    descrizione: Il cursore non appartiene all'elenco dei fascicoli o è illeggibile.
    azione: Ripartire dalla prima pagina senza cursore.
    esito: NON_VALIDO
    ritentabile: false
  FSC-422-CHIUSURA:
    famiglia: FSC
    status: 422
    titolo: Data di chiusura non valida
    descrizione: La data di chiusura è precedente all'apertura del fascicolo o futura.
    azione: Indicare una data fra l'apertura e oggi.
    esito: NON_VALIDO
    ritentabile: false
  FSC-503:
    famiglia: FSC
    status: 503
    titolo: Fascicoli temporaneamente non disponibili
    descrizione: Il database non ha risposto.
    azione: Riprovare tra poco.
    esito: ERRORE
    ritentabile: true
    retry_after: 30

