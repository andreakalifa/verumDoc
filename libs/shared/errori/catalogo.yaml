# Catalogo unico dei codici d'errore di VerumDoc (VD-C-100).
#
# FONTE DI VERITÀ. Dopo ogni modifica rigenerare i file derivati:
#   python tools/docs/genera_catalogo_errori.py
# che scrive `libs/shared/errori/_catalogo_dati.py` (letto dai servizi, senza
# dipendenze a runtime) e `docs/catalogo/errori.md` (documentazione per i
# clienti). Un test fallisce se i file derivati non sono aggiornati.
#
# Campi di ogni codice:
#   famiglia     prefisso del codice (deve esistere in `famiglie`)
#   status       stato HTTP predefinito della risposta
#   titolo       frase breve e stabile (title del problem+json)
#   descrizione  che cosa significa
#   azione       che cosa deve fare il client
#   esito        NON_VALIDO (colpa della richiesta: correggere e reinviare)
#                RIFIUTATO  (regola o policy: ritentare non serve)
#                ERRORE     (problema del servizio o temporaneo)
#   ritentabile  true se la stessa richiesta, ripetuta più tardi, può riuscire
#   retry_after  (facoltativo) secondi suggeriti nell'intestazione Retry-After
#   contesto     (facoltativo) http (predefinito) | asincrono: il codice non è
#                una risposta HTTP ma compare in `errori[]` dello stato del PdV
#   alias        (facoltativo) codici del vecchio formato che il gestore
#                riconduce a questo (es. errori PDND in stile OAuth)
#   dismesso     (facoltativo) true se il codice non è più emesso; il titolo
#                allora inizia con «Dismesso: vedi …»
#   sostituito_da (facoltativo, solo per i dismessi) codici che lo sostituiscono
#
# I codici sono stabili: un codice pubblicato non cambia significato e non si
# riusa. Un codice dismesso resta nel catalogo con `titolo` che lo dichiara.

versione: "2026.10.21"

famiglie:
  VRS:
    descrizione: Versamento sincrono di un pacchetto di versamento (PdV) al gateway e consultazione del suo stato e del rapporto di versamento.
  VLD:
    descrizione: Verifica asincrona del PdV (passi della pipeline di validazione). I codici compaiono in `errori[]` dello stato del PdV, non come risposta HTTP.
  AIP:
    descrizione: Costruzione asincrona del pacchetto di archiviazione (PdA). I codici compaiono in `errori[]` dello stato del PdV.
  SEC:
    descrizione: Controlli di sicurezza sui dati in ingresso (nomi, testi, estensioni, indirizzi).
  AUTH:
    descrizione: Autenticazione e autorizzazione (token JWT, chiavi API, revoca, ruoli e scope).
  SPID:
    descrizione: Accesso al portale con SPID o CIE tramite aggregatore.
  PDND:
    descrizione: E-service esposti su PDND Interoperabilità (voucher, fruitori, versamento ed esibizione).
  RATE:
    descrizione: Limiti di frequenza delle richieste.
  LC:
    descrizione: Ciclo di vita dei pacchetti conservati (scarto, rettifica, migrazione).
  HC:
    descrizione: Catena delle impronte (hashchain) e sua verifica.
  DST:
    descrizione: Distribuzione ed esibizione (pacchetti di distribuzione, ricerca).
  FSC:
    descrizione: Fascicoli e aggregazioni documentali.
  MIG:
    descrizione: Migrazione e riversamento dei pacchetti.
  DL:
    descrizione: Scaricamento dei pacchetti, dei file e dei rapporti dal portale.
  DSH:
    descrizione: API del portale (dashboard) e inoltro verso i servizi interni.
  GOV:
    descrizione: Governo del servizio dal portale (clienti, contratti, nomine).
  SLA:
    descrizione: Rapporti sui livelli di servizio.
  SIG:
    descrizione: API del servizio di firma e marca (autenticazione e forma della richiesta).
  FIRMA:
    descrizione: Firma qualificata e marca temporale (adattatori verso i fornitori).
  ONB:
    descrizione: Attivazione e gestione dei clienti, degli utenti, delle chiavi API e delle classi documentali.
  S3:
    descrizione: Storage conservativo (Object Lock / WORM).
  VAL:
    descrizione: Forma della richiesta non conforme allo schema dell'API (campi mancanti, tipi errati).
  HTTP:
    descrizione: Errori HTTP generici senza codice di dominio (rotta inesistente, metodo non ammesso, errori dei servizi che non indicano un codice).
  INTERNAL:
    descrizione: Errori interni non previsti. Il dettaglio resta nei log, il client riceve solo l'identificativo della richiesta.
  UPL:
    descrizione: Sessioni di caricamento dei file (caricamento in streaming e a parti, ripresa).
  SFTP:
    descrizione: Canale di versamento via SFTP (cartelle di deposito, esiti, ricevute).
  WH:
    descrizione: Webhook firmati verso i sistemi dei clienti (sottoscrizioni, consegne, firme).
  EVT:
    descrizione: Elenco degli eventi consultabile dai clienti (cursore, filtri).
  CMP:
    descrizione: Adattatori di compatibilità, tolti in R18.2 (VD-P-191). Nessun codice della famiglia è più emesso; restano elencati perché un codice pubblicato non si riusa.
  RGL:
    descrizione: Motore delle regole (metadati per classe, severità, versioni delle regole).
  CFG:
    descrizione: Configurazione del servizio per conservatore ed enti (impostazioni, regole, profili di metadati, accordi di versamento, quote) con bozze, anteprima, applicazione e proposte; validatore preventivo (R05).
  QTA:
    descrizione: Quote e limiti di consumo per piano contrattuale.
  CAT:
    descrizione: Registro delle impronte a due livelli (checkpoint firmati, prove d'inclusione e di consistenza, contratto K1 di R04).
  TST:
    descrizione: Testimone indipendente della catena delle impronte (controfirma dei checkpoint del registro, protocollo ispirato a C2SP tlog-witness).
  IDEM:
    descrizione: Idempotency-Key delle richieste che creano una risorsa fuori dal versamento (richiesta di un PdD, creazione di un webhook).
  INT:
    descrizione: Verifica continua dell'integrità dell'archivio (rilettura periodica e su richiesta degli oggetti conservati, registro delle verifiche).
  ACC:
    descrizione: "R10 (D08): accesso delle persone con password e codice a tempo o con passkey, inviti per e-mail con attivazione guidata, fornitori d'identità e metodi d'accesso degli enti."
  RUO:
    descrizione: "R10 (D30): ruoli personalizzati dell'ente composti dai permessi concedibili."
  NTF:
    descrizione: "R10 (D32): campanella «da fare per te» e preferenze delle notifiche."

codici:
  # ── VRS: versamento ────────────────────────────────────────────────
  VRS-001:
    famiglia: VRS
    status: 400
    titolo: Indice del versamento non valido
    descrizione: L'indice dell'unità documentaria non è un JSON valido o non rispetta lo schema.
    azione: Correggere l'indice secondo lo schema pubblicato e reinviare.
    esito: NON_VALIDO
    ritentabile: false
  VRS-010:
    famiglia: VRS
    status: 413
    titolo: File troppo grande
    descrizione: Un file supera la dimensione massima ammessa per un singolo file.
    azione: Ridurre il file o usare il canale previsto per i file grandi.
    esito: NON_VALIDO
    ritentabile: false
  VRS-101:
    famiglia: VRS
    status: 400
    titolo: File dichiarato ma non allegato
    descrizione: L'indice dichiara un file che non è presente fra gli allegati.
    azione: Allegare il file dichiarato o toglierlo dall'indice.
    esito: NON_VALIDO
    ritentabile: false
  VRS-102:
    famiglia: VRS
    status: 400
    titolo: Impronta del file errata
    descrizione: L'impronta calcolata sul file ricevuto non corrisponde a quella dichiarata nell'indice.
    azione: Ricalcolare l'impronta sul file effettivamente inviato e reinviare.
    esito: NON_VALIDO
    ritentabile: false
  VRS-103:
    famiglia: VRS
    status: 400
    titolo: "Dismesso: vedi VRS-130 (rilievo RGL-101)"
    descrizione: Il documento principale non contiene i metadati obbligatori dell'Allegato 5. Da R03 i metadati minimi li verifica la regola RGL-101 e il rifiuto è VRS-130 (422) con l'elenco dei rilievi.
    azione: Gestire VRS-130 e leggere `dettagli.rilievi[]`.
    esito: NON_VALIDO
    ritentabile: false
    dismesso: true
    sostituito_da: [VRS-130, RGL-101]
  VRS-104:
    famiglia: VRS
    status: 400
    titolo: File allegati non dichiarati
    descrizione: Sono stati allegati file che l'indice non dichiara.
    azione: Dichiarare ogni file nell'indice o toglierlo dagli allegati.
    esito: NON_VALIDO
    ritentabile: false
  VRS-105:
    famiglia: VRS
    status: 422
    titolo: Classe documentale non censita
    descrizione: La classe documentale indicata non esiste per il cliente.
    azione: Usare una classe censita o chiederne la configurazione al conservatore.
    esito: RIFIUTATO
    ritentabile: false
  VRS-106:
    famiglia: VRS
    status: 422
    titolo: Classe documentale non attiva
    descrizione: La classe documentale esiste ma non è attiva per il versamento.
    azione: Chiedere l'attivazione della classe o usarne un'altra.
    esito: RIFIUTATO
    ritentabile: false
  VRS-107:
    famiglia: VRS
    status: 400
    titolo: Algoritmo d'impronta non ammesso
    descrizione: L'algoritmo d'impronta dichiarato non è fra quelli ammessi.
    azione: Usare uno degli algoritmi elencati in `dettagli.ammessi`.
    esito: NON_VALIDO
    ritentabile: false
  VRS-108:
    famiglia: VRS
    status: 422
    titolo: File eseguibile non ammesso
    descrizione: Il contenuto del file è un eseguibile; gli eseguibili non si conservano, qualunque sia il nome.
    azione: Togliere il file dal versamento.
    esito: RIFIUTATO
    ritentabile: false
  VRS-109:
    famiglia: VRS
    status: 422
    titolo: Formato del file non coerente
    descrizione: Il formato rilevato dal contenuto non è riconosciuto o non corrisponde a quello dichiarato.
    azione: Dichiarare il formato reale del file o convertirlo in un formato ammesso.
    esito: NON_VALIDO
    ritentabile: false
  VRS-110:
    famiglia: VRS
    status: 400
    titolo: Dato d'ingresso non valido
    descrizione: Un dato della richiesta non ha superato i controlli d'ingresso.
    azione: Correggere il dato indicato nel dettaglio e reinviare.
    esito: NON_VALIDO
    ritentabile: false
  VRS-111:
    famiglia: VRS
    status: 400
    titolo: Nome file ripetuto
    descrizione: Lo stesso nome file compare più volte nell'indice o fra gli allegati.
    azione: Dare a ogni file un nome univoco nel versamento.
    esito: NON_VALIDO
    ritentabile: false
  VRS-112:
    famiglia: VRS
    status: 422
    titolo: "Dismesso: vedi VRS-130 (rilievo RGL-105)"
    descrizione: Il formato del file non è fra quelli ammessi dalla classe documentale. Da R03 lo verifica la regola RGL-105 e il rifiuto è VRS-130 (422) con il rilievo.
    azione: Gestire VRS-130 e leggere `dettagli.rilievi[]`.
    esito: RIFIUTATO
    ritentabile: false
    dismesso: true
    sostituito_da: [VRS-130, RGL-105]
  VRS-113:
    famiglia: VRS
    status: 413
    titolo: Troppi file nel versamento
    descrizione: Il versamento supera il numero massimo di file ammesso.
    azione: Dividere l'unità documentaria o usare una sessione di caricamento.
    esito: NON_VALIDO
    ritentabile: false
  VRS-114:
    famiglia: VRS
    status: 400
    titolo: Documenti annidati non ammessi
    descrizione: L'indice contiene documenti dentro il campo `allegati` di un documento. Il modello dell'indice è piatto (R03 f1); prima questi documenti erano accettati e ignorati senza avviso.
    azione: Elencare allegati e annessi direttamente in `documenti`, con `tipo` ALLEGATO, ANNESSO o ANNOTAZIONE.
    esito: NON_VALIDO
    ritentabile: false
  VRS-120:
    famiglia: VRS
    status: 409
    titolo: Versamento duplicato
    descrizione: Lo stesso indice è già stato versato e il PdV esistente non è stato rifiutato.
    azione: Consultare il PdV indicato in `dettagli.pdv_id_esistente`; non reinviare.
    esito: RIFIUTATO
    ritentabile: false
  VRS-121:
    famiglia: VRS
    status: 409
    titolo: Chiave di idempotenza già usata
    descrizione: La Idempotency-Key è già stata usata con un contenuto diverso.
    azione: Usare una nuova chiave per un versamento diverso.
    esito: NON_VALIDO
    ritentabile: false
  VRS-122:
    famiglia: VRS
    status: 400
    titolo: Chiave di idempotenza non valida
    descrizione: La Idempotency-Key non rispetta il formato ammesso.
    azione: "Usare da 8 a 200 caratteri fra lettere, cifre e i segni . _ : -"
    esito: NON_VALIDO
    ritentabile: false
  VRS-123:
    famiglia: VRS
    status: 409
    titolo: Versamento in conflitto
    descrizione: Un altro versamento con la stessa chiave è stato registrato nello stesso istante.
    azione: Ripetere la richiesta con la stessa chiave per leggerne l'esito.
    esito: ERRORE
    ritentabile: true
  VRS-124:
    famiglia: VRS
    status: 409
    titolo: Chiave dell'unità documentaria già usata
    descrizione: Registro, anno e numero dell'indice identificano già un altro versamento attivo dello stesso cliente con un contenuto diverso (VD-C-095). Un PdV rifiutato libera la chiave.
    azione: Verificare il PdV indicato in `dettagli.pdv_id_esistente`; per un'unità documentaria diversa usare un'altra chiave.
    esito: RIFIUTATO
    ritentabile: false
  VRS-125:
    famiglia: VRS
    status: 428
    titolo: Idempotency-Key obbligatoria
    descrizione: Il versamento è arrivato senza l'intestazione Idempotency-Key dopo la fine del periodo di transizione (VD-P-27).
    azione: Inviare un identificativo univoco per ogni versamento nell'intestazione Idempotency-Key, riusandolo sui ritentativi dello stesso versamento.
    esito: NON_VALIDO
    ritentabile: false
  VRS-126:
    famiglia: VRS
    status: 428
    titolo: Versamento senza Idempotency-Key (avviso)
    descrizione: Avviso, non errore (compare fra gli `avvisi` della risposta 202; lo stato 428 è quello che riceverà la stessa richiesta dopo la transizione, VRS-125). Durante il periodo di transizione un versamento senza Idempotency-Key è accettato con una chiave derivata dal contenuto; la risposta porta le intestazioni Deprecation e Sunset e questo codice fra gli `avvisi`.
    azione: Inviare l'intestazione Idempotency-Key prima della data indicata nell'intestazione Sunset.
    esito: NON_VALIDO
    ritentabile: false
  VRS-127:
    famiglia: VRS
    status: 409
    titolo: Versamento già concluso con esito negativo
    descrizione: La richiesta ripete (stessa Idempotency-Key, o stesso contenuto con la chiave derivata dei canali di compatibilità) un versamento il cui PdV è stato rifiutato dalla verifica, è in errore o è annullato. Il PdV non è conservato; la risposta indica il PdV e il suo stato (R03 f1).
    azione: Leggere lo stato del PdV in `dettagli.link`; correggere e versare di nuovo con un contenuto corretto e, se la si usa, una nuova Idempotency-Key. Per un errore tecnico chiedere al conservatore la rielaborazione del PdV.
    esito: RIFIUTATO
    ritentabile: false
  VRS-130:
    famiglia: VRS
    status: 422
    titolo: Versamento non conforme alle regole di conservazione
    descrizione: Il motore delle regole ha trovato uno o più rilievi bloccanti (metadati minimi o obbligatori mancanti, tipi dei metadati del profilo, dimensione o formato non ammessi dalla classe). L'elenco completo è in `dettagli.rilievi` (codice della regola RGL-nnn, campo, documento, messaggio).
    azione: Correggere tutti i rilievi elencati e reinviare.
    esito: RIFIUTATO
    ritentabile: false
  VRS-403:
    famiglia: VRS
    status: 403
    titolo: Cliente o utente non identificabili
    descrizione: Il token non indica un cliente o un utente validi per il versamento.
    azione: Ottenere un token emesso per un utente o una chiave del cliente.
    esito: RIFIUTATO
    ritentabile: false
  VRS-404:
    famiglia: VRS
    status: 404
    titolo: PdV non trovato
    descrizione: Il PdV non esiste o non appartiene al cliente del token.
    azione: Verificare l'identificativo del PdV.
    esito: NON_VALIDO
    ritentabile: false
  VRS-409:
    famiglia: VRS
    status: 409
    titolo: Rapporto di versamento non ancora disponibile
    descrizione: Il rapporto di versamento definitivo si emette quando il PdV è conservato.
    azione: Riprovare quando lo stato del PdV è CONSERVATO.
    esito: ERRORE
    ritentabile: true
  VRS-500:
    famiglia: VRS
    status: 503
    titolo: Storage temporaneamente non disponibile
    descrizione: Lo storage dei file non ha accettato la scrittura; nessun dato è stato registrato.
    azione: Ripetere il versamento con la stessa Idempotency-Key.
    esito: ERRORE
    ritentabile: true
    retry_after: 30
  VRS-501:
    famiglia: VRS
    status: 503
    titolo: Database temporaneamente non disponibile
    descrizione: Il database non ha risposto; nessun dato è stato registrato.
    azione: Ripetere il versamento con la stessa Idempotency-Key.
    esito: ERRORE
    ritentabile: true
    retry_after: 30
  VRS-502:
    famiglia: VRS
    status: 502
    titolo: Rapporto di versamento non integro
    descrizione: Il rapporto letto dallo storage non corrisponde all'impronta registrata.
    azione: Segnalare al conservatore indicando l'identificativo della richiesta.
    esito: ERRORE
    ritentabile: false
  VRS-503:
    famiglia: VRS
    status: 503
    titolo: Storage temporaneamente non disponibile
    descrizione: Lo storage non ha restituito il rapporto di versamento.
    azione: Riprovare tra qualche minuto.
    esito: ERRORE
    ritentabile: true
    retry_after: 30

  # ── VLD: verifica asincrona ────────────────────────────────────────
  VLD-100:
    famiglia: VLD
    status: 500
    titolo: Errore interno nel passo 1 della verifica
    descrizione: Il passo di verifica è terminato con un'eccezione non prevista (codice VLD-<passo>00).
    azione: Segnalare al conservatore; il PdV sarà riverificato.
    esito: ERRORE
    ritentabile: true
    contesto: asincrono
