  DL-401:
    famiglia: DL
    status: 401
    titolo: Autenticazione richiesta
    descrizione: Lo scaricamento richiede un token JWT.
    azione: Inviare un token Bearer.
    esito: NON_VALIDO
    ritentabile: false
  DL-403:
    famiglia: DL
    status: 403
    titolo: Cliente non indicato
