[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verumdoc-aip-builder"
version = "0.1.0"
requires-python = ">=3.12"
license = { text = "EUPL-1.2" }  # R18 (VD-P-190): SPDX, testo in LICENSE
# Dipendenze verificate con grep degli import di app/ e delle librerie
# libs/shared usate dal servizio (VD-C-031). FastAPI >=0.117: con le versioni
# precedenti le rotte 204 con `from __future__ import annotations` non si importano.
dependencies = [
    # R16 (VD-C-176): esportatore OTLP e propagazione HTTP delle tracce (BSD-3-Clause)
    "httpx>=0.27.0,<1",
    # R16 (VD-C-176): tracce OpenTelemetry (Apache-2.0), attive solo con OTEL_TRACCE_ATTIVE
    "opentelemetry-sdk>=1.40.0,<2",
    "fastapi>=0.117.0,<0.157",
    "uvicorn[standard]>=0.30.0,<1",
    "pydantic>=2.7.0,<3",
    "pydantic-settings>=2.3.0,<3",
    "structlog>=24.1.0",
    "sqlalchemy[asyncio]>=2.0.30,<2.2",
    "asyncpg>=0.29.0,<1",
    "aiokafka>=0.11.0,<1",
    # R04: Kafka su MSK con autenticazione IAM (KAFKA_AUTENTICAZIONE=iam), Apache-2.0
    "aws-msk-iam-sasl-signer-python==1.0.2",
    "boto3>=1.34.0,<2",
    "prometheus-client>=0.20.0,<1",
    # R11 (D03): validazione dell'IPdA contro lo schema XSD caricato (libs/sincro), BSD-3
    "lxml>=5.2,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "bandit>=1.7.0",
    "httpx>=0.27.0,<1",
    "moto[s3]>=5.0.0,<6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
