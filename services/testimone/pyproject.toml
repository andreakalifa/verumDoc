[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verumdoc-testimone"
version = "0.1.0"
requires-python = ">=3.12"
license = { text = "EUPL-1.2" }  # R18 (VD-P-190): SPDX, testo in LICENSE
# Testimone indipendente della catena delle impronte (R04, contratto K3).
# Dipendenze verificate con gli import di app/, alembic/ e delle librerie
# usate (libs/catena, libs/shared/errori, libs/shared/observability,
# libs/shared/db). Nessuna dipendenza da Kafka, S3 o dal database del registro:
# il servizio deve poter girare in un account separato.
dependencies = [
    # R16 (VD-C-176): esportatore OTLP e propagazione HTTP delle tracce (BSD-3-Clause)
    "httpx>=0.27.0,<1",
    # R16 (VD-C-176): tracce OpenTelemetry (Apache-2.0), attive solo con OTEL_TRACCE_ATTIVE
    "opentelemetry-sdk>=1.40.0,<2",
    "fastapi>=0.117.0,<0.157",
    "uvicorn[standard]>=0.30.0,<1",
    "pydantic>=2.7.0,<3",
    "pydantic-settings>=2.3.0,<3",
    "structlog>=24.1.0",
    "sqlalchemy[asyncio]>=2.0.30,<2.2",
    "asyncpg>=0.29.0,<1",
    "alembic>=1.13.0,<2",
    "prometheus-client>=0.20.0,<1",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0,<1",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

