[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verumdoc-ciclo-vita"
version = "1.0.0"
requires-python = ">=3.12"
license = { text = "EUPL-1.2" }  # R18 (VD-P-190): SPDX, testo in LICENSE
# Ciclo di vita dei pacchetti (R05, contratto Q2, VD-P-06). Dipendenze verificate
# con gli import di app/ e delle librerie usate (libs/shared: db, errori,
# outbox, kafka, security, storage, observability, limiti_richieste).
# defusedxml: parser XML sicuro (DTD ed entità vietate) per gli indici dei PdD ricevuti.
dependencies = [
    # R16 (VD-C-176): tracce OpenTelemetry (Apache-2.0), attive solo con OTEL_TRACCE_ATTIVE
    "opentelemetry-sdk>=1.40.0,<2",
    "fastapi>=0.117.0,<0.157",
    "uvicorn[standard]>=0.30.0,<1",
    "pydantic>=2.7.0,<3",
    "pydantic-settings>=2.3.0,<3",
    "python-multipart>=0.0.9,<1",
    "structlog>=24.1.0",
    "sqlalchemy[asyncio]>=2.0.30,<2.2",
    "asyncpg>=0.29.0,<1",
    "aiokafka>=0.11.0,<1",
    # Kafka su MSK con autenticazione IAM (KAFKA_AUTENTICAZIONE=iam), Apache-2.0
    "aws-msk-iam-sasl-signer-python==1.0.2",
    "boto3>=1.34.0,<2",
    "prometheus-client>=0.20.0,<1",
    "PyJWT>=2.8.0,<3",
    "cryptography>=42.0.0,<51",
    # R08 (D01, D22): verifica delle firme di autorizzazioni, nulla osta e richieste di
    # annullamento (libs/shared/firme): pyHanko (MIT) e asn1crypto (MIT)
    "asn1crypto>=1.5.0,<2",
    "pyHanko>=0.38.0,<0.40",
    "pyhanko-certvalidator>=0.33.0,<0.35",
    "httpx>=0.27.0,<1",
    "redis[hiredis]>=5.0.0,<9",
    "defusedxml>=0.7.1,<0.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "bandit>=1.7.0",
    "moto[server]>=5.0.0,<6",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
