[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verumdoc-sftp-ingest"
version = "0.1.0"
requires-python = ">=3.12"
license = { text = "EUPL-1.2" }  # R18 (VD-P-190): SPDX, testo in LICENSE
# Dipendenze verificate con grep degli import di app/ e delle librerie
# libs/shared usate dal servizio (VD-C-031).
# asyncssh: licenza EPL-2.0 (o GPL-2.0-or-later, a scelta): usata come libreria
# non modificata; scelta motivata nel rapporto R03 b2 (da confermare, REGOLE §20.8).
dependencies = [
    # R16 (VD-C-176): tracce OpenTelemetry (Apache-2.0), attive solo con OTEL_TRACCE_ATTIVE
    "opentelemetry-sdk>=1.40.0,<2",
    "fastapi>=0.117.0,<0.157",
    "uvicorn[standard]>=0.30.0,<1",
    "pydantic>=2.7.0,<3",
    "pydantic-settings>=2.7.0,<3",
    "structlog>=24.1.0",
    "sqlalchemy[asyncio]>=2.0.30,<2.2",
    "asyncpg>=0.29.0,<1",
    "httpx>=0.27.0,<1",
    "asyncssh==2.24.1",
    "PyJWT[crypto]>=2.8.0,<3",
    "cryptography>=42.0.0",
    "prometheus-client>=0.20.0,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "bandit>=1.7.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
