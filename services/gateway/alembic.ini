# Alembic configuration — gateway service
# Riferimento piano: F0.4 — Schema Database
# Per eseguire le migration:
#   cd services/gateway
#   alembic upgrade head
#   alembic history
#   alembic current

[alembic]
script_location = alembic
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
prepend_sys_path = .
path_separator = os

# Il DATABASE_URL viene letto dall'env var — mai hardcoded
sqlalchemy.url = postgresql+asyncpg://vd_user:vd_secret_dev_only@localhost:5432/verumdoc_dev

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
